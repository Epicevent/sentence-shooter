<style>

  #hud {

  #h-resource { display:flex; align-items:center; gap:7px; color:var(--dim); }

  @keyframes promptwaveB { 0%{box-shadow:0 0 0 rgba(94,230,223,0);} 35%{box-shadow:0 0 30px rgba(94,230,223,.65);border-color:#5ee6df;}

  @keyframes assemblyLinkB { 0%{transform:translate(-50%,-50%) scale(1.1);opacity:1;}

    78%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.18);opacity:1;}

  }
  .overlay .mode-kicker { color: var(--gold); letter-spacing: 4px; font-size: 12px; }
  .hidden { display: none !important; }
</style>

// tap-to-lock, ZType style: the ship fires a stream of homing missiles at the locked word
function tapAt(x, y){
  if (!g || g.over || g.viewportPaused) return;   // keyboard and pointer both live when play is visible
  if (g.pendingSentenceClear || g.idx >= g.sentence.length){
    $('msg').textContent='# FINAL IMPACT INBOUND · movement remains live'; return;
  }
  // A resolved word remains visible for its impacts, but is no longer an input target.
  const now = performance.now();
  if (inputJammed('tap')) return;
  const live = g.words.filter(w => !w.resolved);
  let w = live.find(w => {
    const wx = wordVisualX(w, now), wy = wordVisualY(w, now);
    return x >= wx && x <= wx + w.w && y >= wy && y <= wy + w.h;
  });
  // Padding makes narrow/mobile blocks easier to hit, but adjacent padded boxes can overlap.
  // In that fringe choose the visually nearest block instead of array order (which leaks answer order).
  if (!w){
    w = live.filter(word => {
      const wx = wordVisualX(word, now), wy = wordVisualY(word, now);
      return x >= wx - 8 && x <= wx + word.w + 8 && y >= wy - 8 && y <= wy + word.h + 8;
    }).sort((a,b) => {
      const ax=wordVisualX(a,now)+a.w/2, ay=wordVisualY(a,now)+a.h/2;
      const bx=wordVisualX(b,now)+b.w/2, by=wordVisualY(b,now)+b.h/2;
      return Math.hypot(x-ax,y-ay)-Math.hypot(x-bx,y-by);
    })[0];
  }
  if (!w) return;
  w = equivalentTarget(w);
  armCombat('tap_answer');
  tEv('tap_input', { x: roundTrace(x), y: roundTrace(y), order: w.order, w: w.text,
    correct: w.order === g.idx, scene: traceScene() });
  g.typePrefix = ''; g.lock = null;
  if (w.order === g.idx){
    g.missChain = 0;
    g.lock = w;
    queueDamageVolley(w, w.maxhp - w.committed);   // one tap commits a full kill; visuals follow independently
    tone(600, 900, .06, 'square', .05);            // lock blip
  } else {
    applyWrongPenalty(w,{ want:(g.words.find(word=>word.order===g.idx)||{}).text });
  }
}

function launchMissile(target, dmg, letter, level){

    ? heavyWeaponOrigins()

    vx: (Math.random()*2 - 1) * 260,          // flare out sideways...
    vy: -220 - Math.random()*120,             // ...then curve into the target

  });
}

// Gameplay is committed when a deterministic shot is launched/scheduled. The missile and
// explosion are presentation: they may finish later without holding the next input hostage.
function commitMissile(target, letter, level){
  if (!target || target.resolved) return;
  target.committed++;
  launchMissile(target, 1, letter, level);
  if (target.committed >= target.maxhp) resolveWord(target);
}

function queueDamageVolley(target, count){
  count = Math.max(0, count | 0);
  if (!count || !target || target.resolved) return;
  const level=weaponLv(), gap=volleyGap(level);
  target.committed += count;                         // deterministic reservation: this damage cannot be canceled
  g.fireQueues.push({ target, remaining: count, t: 0, gap, level });
  if (target.committed >= target.maxhp) resolveWord(target);
}

function spawnMissiles(dt){
  for (const q of g.fireQueues){
    if (!g.words.includes(q.target)){ q.remaining = 0; continue; }
    q.t -= dt;
    while (q.remaining > 0 && q.t <= 0){
      q.remaining--;
      q.t += q.gap;
      sfx.pew();
      launchMissile(q.target, 1,undefined,q.level);
    }
  }
  g.fireQueues = g.fireQueues.filter(q => q.remaining > 0);
}

function advanceTypedKey(t, key){
  if (!t || t.resolved || t.consumed >= t.text.length) return false;
  const expected = t.text[t.consumed];
  if (expected.toLowerCase() !== key.toLowerCase()) return false;
  tEv('key_input', { order:t.order, k:key, w:t.text, at:t.consumed, scene:traceScene() });
  g.missGraceUntil = 0;
  g.lock = t;
  const level=weaponLv();
  t.consumed++;
  sfx.pew();
  commitMissile(t, expected,level);
  while (t.consumed < t.text.length && !SIG.test(t.text[t.consumed])){
    t.consumed++;                            // commas and periods ride along as free missiles
    launchMissile(t, 0,undefined,level);
  }
  for (let i = 1; i < level; i++) launchMissile(t, 0,undefined,level);
  return true;
}

function suppressTypedMiss(chosen, key, guess, expected){
  const now = performance.now();
  tEv('miss_suppressed', {
    order: chosen ? chosen.order : null, k:key, want:expected || undefined,
    w:chosen ? chosen.text : '', guess:guess || '',
    remaining:Math.max(0,Math.round(g.missGraceUntil-now)), scene:traceScene(),
  });
}

function penalizeTypedGuess(chosen, key, guess, expected){
  applyWrongPenalty(chosen,{ k:key, want:expected || undefined, guess:guess || '' });
}

function focusCandidates(prefix){
  if (!g || !prefix) return [];
  const normalized=String(prefix).toLowerCase();
  return g.words.filter(w=>!w.resolved && typingForm(w.text).startsWith(normalized));
}
function focusSelection(prefix){
  const candidates=focusCandidates(prefix);
  const forms=[...new Set(candidates.map(w=>choiceIdentity(w.text)))];
  if (forms.length!==1) return { candidates, forms, chosen:null };
  const target=g.words.find(w=>!w.resolved&&w.order===g.idx);
  const chosen=target && forms[0]===choiceIdentity(target.text) ? target : candidates[0];
  return { candidates, forms, chosen };
}
function describeFocus(){
  if (!g.typePrefix){ $('msg').textContent='# focus cleared — type to light matching chunks'; return; }
  const state=focusSelection(g.typePrefix);
  if (state.forms.length===1){
    $('msg').innerHTML='<span style="color:var(--bright)">FOCUS '+esc(g.typePrefix.toUpperCase())+'</span> · '+
      state.candidates.length+' target'+(state.candidates.length===1?'':'s')+' · <span style="color:var(--gold)">TAB TO CONFIRM</span>';
  } else {
    $('msg').innerHTML='<span style="color:var(--bright)">FOCUS '+esc(g.typePrefix.toUpperCase())+'</span> · '+
      state.candidates.length+' candidates · keep typing to narrow';
  }
}

// Typing only builds a visible candidate focus. It never judges grammar by itself.
function handleKey(key){
  if (!g || g.over || g.viewportPaused) return;
  if (g.pendingSentenceClear || g.idx >= g.sentence.length){
    $('msg').textContent='# FINAL IMPACT INBOUND · movement remains live'; return;
  }
  if (key==='Backspace'){
    if (!g.typePrefix) return;
    g.typePrefix=g.typePrefix.slice(0,-1); g.lock=null;
    const state=focusSelection(g.typePrefix);
    if (state.chosen) g.lock=state.chosen;
    tEv('focus_change',{ prefix:g.typePrefix, candidates:state.candidates.map(w=>w.order),
      reason:'backspace', scene:traceScene() });
    describeFocus(); return;
  }
  if (key.length!==1 || !SIG.test(key)) return;
  if (inputJammed('type')) return;
  const attempted=(g.typePrefix+key).toLowerCase();
  const candidates=focusCandidates(attempted);
  tEv('key_input',{ order:null, k:key, prefix:g.typePrefix, attempted, scene:traceScene() });
  if (!candidates.length){
    const rejected=attempted; g.typePrefix=''; g.lock=null;
    tEv('focus_clear',{ rejected, reason:'no_match', scene:traceScene() });
    tone(180,120,.05,'square',.025);
    $('msg').innerHTML='<span style="color:var(--dim)">NO MATCH '+esc(rejected.toUpperCase())+'</span> — focus cleared, no penalty';
    return;
  }
  g.typePrefix=attempted; g.missGraceUntil=0;
  const state=focusSelection(g.typePrefix);
  g.lock=state.chosen;
  tEv('type_prefix',{ prefix:g.typePrefix, candidates:candidates.map(w=>w.order),
    unique:state.chosen ? state.chosen.order : null, scene:traceScene() });
  tone(state.chosen?520:340,state.chosen?760:430,.045,'square',.025);
  describeFocus();
}

// Tab is no longer an inventory item or an answer reveal. It only confirms a unique visible focus.
function handleTab(){
  if (!g || g.over || g.viewportPaused) return;
  if (g.pendingSentenceClear || g.idx >= g.sentence.length){
    $('msg').textContent='# FINAL IMPACT INBOUND · movement remains live'; return;
  }
  if (inputJammed('tab')) return;
  if (g.typePrefix){
    const prefix=g.typePrefix, state=focusSelection(prefix);
    if (!state.chosen){
      tEv('focus_confirm_blocked',{ prefix, candidates:state.candidates.map(w=>w.order), scene:traceScene() });
      sfx.plink(); describeFocus(); return;
    }
    const chosen=equivalentTarget(state.chosen), correct=chosen.order===g.idx;
    armCombat('focus_confirm');
    tEv('focus_confirm',{ prefix, order:chosen.order, w:chosen.text, correct, scene:traceScene() });
    g.typePrefix=''; g.lock=null;
    if (correct){
      g.missChain=0; g.lock=chosen;
      queueDamageVolley(chosen,chosen.maxhp-chosen.committed);
      tone(600,900,.06,'square',.05);
    } else applyWrongPenalty(chosen,{ guess:prefix, confirm:'tab' });
    updateHud(); return;
  }
  tEv('focus_confirm_blocked',{ prefix:'', candidates:[], reason:'no_focus', scene:traceScene() });
  sfx.plink();
  $('msg').innerHTML='<span style="color:var(--dim)">NO FOCUS TO CONFIRM</span> · type until one visible choice remains';
}

// OpenTyrian's galaga-mode rule (tyrian2.c:1147): score thresholds grant lives,
// each threshold recedes, and a full stock converts to points instead of vanishing
function checkExtraLife(){
  while (g.score >= g.nextLife){
    if (g.lives < 5){ g.lives++; banner('1UP', true); sfx.up(); buzz([30,50,30]); }
    else g.score += 1000;
    g.nextLife += 25000;
  }
}

function applyCorrectDefense(word,nextTarget){
  // Correct answers never shove the remaining word formation. Their reward is
  // expressed only through A's interceptor formation or B's cooling wake.
  if (nextTarget) nextTarget.threatY = nextTarget.y;
  tEv('correct_reward_route',{variant:g.variant,order:word.order,
    route:g.variant==='A'?'interceptor_formation':'quench_wake',combo:g.combo});
}

function resolveWord(word){
  if (!word || word.resolved || word.isDecoy || g.idx >= g.sentence.length || word.order !== g.idx) return;
  word.resolved = true;
  word.resolvedAt = performance.now();
  g.missGraceUntil = 0;
  g.lastMissAt = 0; g.missChain = 0;
  g.typePrefix = '';
  if (g.lock === word) g.lock = null;
  g.kills++; g.idx++; g.wordT = 0;
  const nextTarget = g.words.find(w => !w.resolved && w.order === g.idx);
  if (nextTarget) nextTarget.threatY = nextTarget.y;
  if (!word.auto) g.combo++;
  word.impactCombo=g.combo; word.impactLevel=weaponLv();
  const finalChunk=g.idx===g.sentence.length;
  $('msg').innerHTML = finalChunk
    ? '<span style="color:var(--bright)">✓ ANSWER LOCKED</span> — final impact inbound'
    : '<span style="color:var(--bright)">✓ CORRECT</span> — impact inbound; choose the next chunk';
  // long words are the fun AND the danger (trace-verified: all deaths were long words) — pay accordingly
  const base = 60 + 9 * word.maxhp;
  const pts = Math.round(word.auto ? base/2 : base);
  word.pts = pts;
  tEv('kill', { order:word.order, w: word.text, auto: !!word.auto, c: g.combo, pts });
  if (finalChunk) g.pendingSentenceClear=true;
  updateHud();
}

function settleWord(word, forced){
  if (!word || word.settled) return;
  const visualX = wordVisualX(word), visualY = wordVisualY(word);
  word.settled = true;
  g.words = g.words.filter(w => w !== word);
  if (g.lock === word) g.lock = null;
  const lag = Math.max(0, Math.round(performance.now() - word.resolvedAt));
  const impact=applyPhysicalImpact(word,visualX+word.w/2,visualY+word.h/2,forced);
  tEv('settle', { order:word.order, w: word.text, lag, forced: !!forced,
    impact_cleared:impact.cleared, core_burst:impact.burst, reward:impact.reward });
  sfx.boom(); buzz(25); shake();
  spawnParts(visualX + word.w/2, visualY + word.h/2, 14, '#d7ba7d', 160);
  spawnParts(visualX + word.w/2, visualY + word.h/2, 8, '#aef0ae', 90);
  if(!forced && word.pts){
    awardScore(word.pts,visualX+word.w/2,visualY+word.h/2,'word_impact');
    popText(visualX + word.w/2, visualY, '+' + word.pts, '#fff4b8');
  }
  if(!forced)launchAssembly(word,visualX+word.w/2,visualY+word.h/2);
  const answerImpactPending=g.words.some(w=>!w.isDecoy&&w.order<g.sentence.length&&!w.settled);
  if(!forced && g.pendingSentenceClear && g.idx===g.sentence.length && !answerImpactPending){
    g.pendingSentenceClear=false;
    sentenceClear();
  }
}

function sentenceClear(){
  for (const decoy of g.words.slice()){
    if (!decoy.resolved && decoy.isDecoy){
      decoy.resolved = true; decoy.resolvedAt = performance.now(); decoy.pts = 0;
      settleWord(decoy, true);
    }
  }
  endHeatVolley('wave_clear');
  g.solved++;
  const secs = Math.round((performance.now() - g.t0)/1000);
  const bonus = Math.max(0, 150 - secs*4);
  const reserveBonus = Math.round((g.recoilBank||0)*4);
  if (reserveBonus) tEv('reserve_bonus',{ bank:roundTrace(g.recoilBank), points:reserveBonus });
  g.recoilBank = 0;
  awardScore(bonus+reserveBonus,W/2,H*.36,'sentence_clear');
  sfx.clear();
  let earned = '';
  if (g.perfect){
    awardScore(250,W/2,H*.36,'perfect');
    banner('PERFECT +250', true); sfx.up();
    earned = '  <span style="color:var(--gold)">+250 PERFECT</span>';
  } else banner('CLEAR');
  if (secs <= Math.ceil(g.sentence.length * 2.8)){
    awardScore(300,W/2,H*.36,'fast_clear');
    earned += '  <span style="color:var(--gold)">+300 FAST CLEAR</span>';
  }
  checkExtraLife();
  tEv('clear', { len: g.sentence.length, secs, perfect: g.perfect });
  $('msg').innerHTML = '<span style="color:var(--bright)">✓ ' + esc(fullReply()) + '</span> +' + bonus +
    (reserveBonus ? ' <span style="color:var(--gold)">+R' + reserveBonus + '</span>' : '') + earned;
  setTimeout(()=>{ if (g && !g.over) nextSentence(); }, 700);
}

function loseLife(word){
  // A formation breach is direct hull damage; there is no shield inventory.
  g.perfect = false; g.wordT = 0;
  const transitionAt=performance.now(), before = traceScene(transitionAt);
  sfx.hit(); buzz(120); shake();
  g.lives--; g.combo = 0;
  if(g.variant==='A') shatterWing('breach');
  else {g.coolerLevel=0;g.wakeNodes=[];}
  if(g.variant==='B') g.sync=0;
  spawnParts(g.ship.x, H - 40, 20, '#d16969', 200);
  if (g.lives <= 0){
    tEv('life_lost', { order:word.order, w: word.text, left: g.lives, before, after: traceScene(transitionAt) });
    gameOver(); return;
  }
  $('msg').innerHTML = '<span style="color:var(--danger)">✦ breach!</span> gun reset — ' + g.lives + ' ships left';
  recoilFormation('life',false,transitionAt);
  tEv('life_lost', { order:word.order, w: word.text, left: g.lives, before, after: traceScene(transitionAt) });
  updateHud();
}

// (the 💡 reveal item was removed — a skill that tells you the answer betrays the drill)

function gameOver(){
  g.over = true;
  if (g.score > g.best){ g.best = g.score; localStorage.setItem('shooter2_best', g.best); }
  const acc = (g.kills + g.plinks) ? Math.round(100 * g.kills / (g.kills + g.plinks)) : 100;
  if (traceOn) traceSample(g.eff || g.speed);
  tEv('over', { score: g.score, solved: g.solved, acc, kills: g.kills, plinks: g.plinks,
    items:false, heat_integral:roundTrace(g.heat.totalMass||0), particles:g.heat.particles.length });
  traceSend();
  $('over-stats').innerHTML =
    'score <b style="color:var(--gold)">' + g.score + '</b><br>' +
    'sentences cleared: ' + g.solved + '<br>' +
    'aim discipline: ' + acc + '% (kills vs armor plinks)<br>' +
    'best: ' + g.best;
  $('over').classList.remove('hidden');
  updateHud();
}

function frame(now){
  if (!g) return;
  const dt = Math.min(0.05, (now - g.lastT)/1000); g.lastT = now;
  if (!g.over){
    if (!g.viewportPaused) update(dt);
    draw();
    traceAcc += dt;
    if (traceAcc >= 0.125){ traceAcc %= 0.125; traceSample(g.eff || g.speed); }
  }
  requestAnimationFrame(frame);
}

function update(dt){
  if (g.viewportPaused) return;
  if (g.freeze > 0){ g.freeze -= dt; return; }   // hit-stop
  for (const s of g.stars){ s.y += s.v*dt; if (s.y > H){ s.y = -2; s.x = Math.random()*W; } }
  g.wordT += dt;
  const siege = true, rules = variantRules(g.variant);
  const eff = g.speed + Math.min(rules.hesitationCap,g.wordT*rules.hesitationAccel);
  g.eff = eff;
  const now = performance.now(), descentActive = now >= (g.waveGraceUntil || 0);
  const moveDir = (moveInput.right?1:0)-(moveInput.left?1:0),shipBeforeX=g.ship.x;
  if (moveDir){
    g.ship.x = Math.max(16,Math.min(W-16,g.ship.x+moveDir*330*dt));
    g.ship.manualUntil = now+180;
  }
  const movedPx=Math.abs(g.ship.x-shipBeforeX);
  if(movedPx>.25)castWakeFromMovement(shipBeforeX,g.ship.x,dt,false);
  else g.wakeDropT=Math.min(g.wakeDropT,.04);
  g.visualPhase += dt*.9;
  const deadline = H - 64, rawStep = descentActive && siege ? eff * dt : 0;
  const bankSpend = siege ? Math.min(rawStep,g.recoilBank || 0) : 0;
  if (bankSpend){ g.recoilBank -= bankSpend; updateReserveHud(); }
  const fullStep = rawStep-bankSpend;
  const target = g.words.find(w => !w.resolved && w.order === g.idx);
  if (target && siege){
    if (!Number.isFinite(target.threatY)) target.threatY = target.y;
    target.threatY += fullStep;
  }
  const future = g.words.filter(w => !w.resolved && w.order !== g.idx);
  const clearance = wingHoldClearance();
  const holdBottom = deadline - clearance;
  const futureRoom = future.length
    ? Math.min(...future.map(w => holdBottom - (w.y + w.h)))
    : fullStep;
  // Every live word shares one visible formation step, so stopping cannot identify the answer
  // or let the target cross another block. The target's threat clock keeps descending invisibly.
  const formationStep = siege ? Math.max(0, Math.min(fullStep, futureRoom)) : 0;
  for (const w of g.words){
    if (w.resolved) w.y += fullStep;
    else if (siege){ w.y += formationStep; if (w.order === g.idx) w.holding = false; }
    else w.holding = false;
    if (w.flash > 0) w.flash -= dt;
    if (w.err > 0) w.err -= dt;
    if (w.heatPulse > 0) w.heatPulse -= dt;
    if (w.resolved) continue;                    // fatal damage is committed; this shell can no longer hurt the player
    if (!siege){ w.holding = false; continue; }
    if (w.order !== g.idx){
      const holding = w.y + w.h >= holdBottom - 0.01;
      if (holding && !w.holding){
        tEv('wing_hold', { order:w.order, w:w.text, y:roundTrace(w.y),
          clearance:roundTrace(clearance), target:g.idx, effect:'hold_position' });
        tone(90, 70, .08, 'sine', .04);
      }
      w.holding = holding;
      continue;
    }
    if ((Number.isFinite(w.threatY) ? w.threatY : w.y) + w.h >= deadline){
      loseLife(w); return;
    }
  }
  if (g.words.some(w=>!w.settled)){
    g.heatEmitT -= dt;
    if(g.heatEmitT<=0){
      const sources=g.words.filter(w=>!w.settled);
      const source=sources[(g.heatSourceCursor=(g.heatSourceCursor||0)+1)%sources.length];
      spawnDustFromWord(source);
      g.heatEmitT=Math.max(.28,DUST_SPAWN_INTERVAL-g.solved*.008);
      g.heatEmitCount=(g.heatEmitCount||0)+1;
      if(g.heatEmitCount%12===0)tEv('heat_sample',{order:source.order,y:roundTrace(wordVisualY(source)),
        active_tracers:g.heat.particles.reduce((n,p)=>n+(p.active?1:0),0),heat_integral:roundTrace(g.heat.totalMass)});
    }
  }
  updateDust(dt,now);
  updateHeatCombat(dt);
  if(g.over)return;
  for(const shot of (g.escortShots||[])){
    shot.t=(shot.t||0)+dt; shot.x+=shot.vx*dt; shot.y+=shot.vy*dt;
  }
  g.escortShots=(g.escortShots||[]).filter(shot=>shot.t<(shot.life||.42));
  for(const mote of (g.scoreMotes||[])){
    const beforeT=mote.t;
    mote.t+=dt;
    const q=Math.max(0,Math.min(1,mote.t/mote.life)), ease=1-Math.pow(1-q,3);
    mote.x=mote.sx+(mote.tx-mote.sx)*ease;
    mote.y=mote.sy+(mote.ty-mote.sy)*ease-Math.sin(Math.PI*q)*42;
    if(beforeT<mote.life && mote.t>=mote.life && !mote.banked){
      mote.banked=true;
      g.scoreDisplay=Math.min(g.score,(g.scoreDisplay||0)+mote.value);
      if(mote.final) flashScore('gain');
    }
  }
  g.scoreMotes=(g.scoreMotes||[]).filter(mote=>mote.t<mote.life);
  if(!(g.scoreMotes||[]).length && Math.abs(g.score-(g.scoreDisplay||0))<1) g.scoreDisplay=g.score;
  const painted=Math.round(g.scoreDisplay||0);
  if(painted!==g.lastScorePaint){ g.lastScorePaint=painted; updateHud(); }
  // Aiming never steers on desktop; arrow/touch movement remains independent of the lock.
  spawnMissiles(dt);
  for (const m of g.missiles){
    const t = m.target;
    if (!t || !g.words.includes(t)){ m.y += -560*dt; m.dead = m.y < -20; continue; }
    const renderX = wordVisualX(t), renderY = wordVisualY(t), tx = renderX + t.w/2, ty = renderY + t.h/2;
    const dx = tx - m.x, dy = ty - m.y, d = Math.hypot(dx, dy) || 1;
    const k = Math.min(1, 7*dt);
    const speed=m.speed||missileSpeed(m.level||1);
    m.vx += (dx/d*speed - m.vx) * k;
    m.vy += (dy/d*speed - m.vy) * k;
    m.x += m.vx*dt; m.y += m.vy*dt;
    if (Math.random() < 0.6) g.parts.push({ x: m.x, y: m.y, vx: 0, vy: 30, life: .25, t: 0, color: '#5a7a5a' });
    if (m.x >= renderX && m.x <= renderX+t.w && m.y >= renderY && m.y <= renderY+t.h){
      m.dead = true;
      t.flash = .12;
      t.hitAt=performance.now(); t.hitDir=m.vx>=0?1:-1;
      spawnParts(m.x, m.y, 7, '#aef0ae', 105);
      addPulse(m.x,m.y,20,'#aef0ae',.16);
      if (m.letter){    // the struck letter breaks off and tumbles away
        g.parts.push({ x: m.x, y: renderY, vx: (Math.random()*2-1)*120, vy: -140, life: .7, t: 0, color: '#d7ba7d', text: m.letter });
      }
      if (m.dmg > 0){
        t.hp = Math.max(0, t.hp - m.dmg);
        tone(300, 80, .08, 'sawtooth', .05);
        if (t.hp <= 0){ g.freeze = 0.05; settleWord(t); } // presentation settles later; hit-stop still makes it land
      }
    }
  }
  g.missiles = g.missiles.filter(m => !m.dead && m.y > -40 && m.x > -40 && m.x < W+40);
  // Temperature is harmless. Only phase-changed red arrows and the descending
  // target are danger; there is no invisible density collision.
  g.danger = (g.heatArrows||[]).some(a=>!a.dead&&a.age>=a.arm) || (g.words.some(w => w.order === g.idx &&
    (Number.isFinite(w.threatY) ? w.threatY : w.y) > H - 200));
  if (g.danger){
    g.beatT -= dt;
    if (g.beatT <= 0){ g.beatT = 0.7; tone(85, 55, .14, 'sine', .16); }
  } else g.beatT = 0;
  for (const p of g.parts){ p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += (p.text ? 0 : 140)*dt; }
  g.parts = g.parts.filter(p => p.t < p.life);
  for(const pulse of g.pulses){
    pulse.t+=dt;
    const q=Math.max(0,Math.min(1,pulse.t/pulse.life));
    pulse.r=4+(pulse.maxR-4)*(1-Math.pow(1-q,3));
  }
  g.pulses=g.pulses.filter(p=>p.t<p.life);
}

function threatLineY(){
  const deadline = H - 64;
  if (!g || !g.words) return deadline;
  const target = g.words.find(w => !w.resolved && w.order === g.idx);
  if (!target || !Number.isFinite(target.threatY)) return deadline;
  return Math.max(34, deadline - Math.max(0, target.threatY - target.y));
}

function signalCore(){
  if (W < 520){
    const core={ x:W/2, y:H-94, r:26, hidden:false };
    const live=g && g.words ? g.words.filter(w=>!w.settled) : [];
    const maxBottom=live.length ? Math.max(...live.map(w=>wordVisualY(w)+w.h)) : -Infinity;
    // The core yields if viewport pressure ever consumes the mobile gap; it must
    // never cover a choice, while spokes and the SIGNAL label stay readable.
    core.hidden=maxBottom+8>core.y-core.r-5;
    return core;
  }
  return { x:W/2, y:Math.min(H-125,Math.max(335,H*.64)), r:48 };
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = g.variant === 'A' ? '#151d35' : '#171735';
  for (const s of g.stars) ctx.fillRect(s.x, s.y, 2, 2);
  // Heat is a continuous amber fog sampled from the authoritative grid. The
  // invisible tracer pool exists only to seed the wrong-answer phase change.
  // Only the explicit red arrow phase below is a projectile layer.
  {
    const field=g.heat;
    drawHeatFog(field);
    for(let i=0;i<field.floorBins.length;i++){
      const heat=field.floorBins[i],hot=Math.max(0,Math.min(1,heat/FLOOR_CRITICAL));
      ctx.globalAlpha=.025+hot*.17;ctx.fillStyle=hot>.55?'#f0bd67':'#5ee6df';
      ctx.fillRect(i*W/field.floorBins.length,H-16,W/field.floorBins.length+1,16);
    }
    for(const arrow of(g.heatArrows||[])){
      if(arrow.dead)continue;
      drawHeatThreat(arrow);
    }
    ctx.shadowBlur=0;
    for(const shot of(g.interceptorShots||[])){
      const d=Math.hypot(shot.vx,shot.vy)||1;ctx.globalAlpha=.95;ctx.strokeStyle='#9fe9fb';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(shot.x,shot.y);ctx.lineTo(shot.x-shot.vx/d*14,shot.y-shot.vy/d*14);ctx.stroke();
    }
    ctx.globalAlpha=1;
    for(const wave of(g.pressureWaves||[])){
      const q=Math.max(0,Math.min(1,wave.t/wave.life));
      ctx.globalAlpha=(1-q)*.7;ctx.strokeStyle='#9fe9fb';ctx.lineWidth=2+wave.guns*.5;
      ctx.beginPath();ctx.moveTo(wave.x-wave.width,wave.y);ctx.quadraticCurveTo(wave.x,wave.y-10,wave.x+wave.width,wave.y);ctx.stroke();
      ctx.globalAlpha=(1-q)*.18;ctx.fillStyle='#73d5ee';ctx.fillRect(wave.x-wave.width,wave.y-10,wave.width*2,20);
    }
    ctx.globalAlpha=1;ctx.lineWidth=1;
  }
  ctx.textBaseline = 'middle';
  ctx.font = '15px "Cascadia Mono", Consolas, monospace';
  const deadlineY = H - 64, pressureY = threatLineY();
  {
    const core=signalCore(), coreX=core.x, coreY=core.y;
    const focusState=focusSelection(g.typePrefix), focusSet=new Set(focusState.candidates);
    for(const w of g.words){
      const wx=wordVisualX(w)+w.w/2, wy=wordVisualY(w)+w.h/2, focused=focusSet.has(w), incoming=w.resolved;
      ctx.strokeStyle=incoming?'rgba(94,230,223,.62)':focused ? (focusState.chosen?'rgba(94,230,223,.85)':'rgba(189,184,255,.75)') : 'rgba(104,100,170,.16)';
      ctx.lineWidth=focused||incoming?2:1; ctx.setLineDash(focused||incoming?[]:[4,8]);
      ctx.beginPath(); ctx.moveTo(coreX,coreY); ctx.lineTo(wx,wy); ctx.stroke();
    }
    ctx.setLineDash([]); ctx.lineWidth=1;
    if(!core.hidden){
      const ratio=Math.max(0,Math.min(1,(deadlineY-pressureY)/Math.max(1,H-130)));
      ctx.strokeStyle='rgba(104,100,170,.35)'; ctx.lineWidth=9;
      ctx.beginPath(); ctx.arc(coreX,coreY,core.r,-Math.PI*.75,Math.PI*.75); ctx.stroke();
      ctx.strokeStyle=ratio>.7?'#d16969':'#5ee6df';
      ctx.beginPath(); ctx.arc(coreX,coreY,core.r,-Math.PI*.75,-Math.PI*.75+Math.PI*1.5*ratio); ctx.stroke();
      ctx.lineWidth=1; ctx.fillStyle='rgba(12,12,31,.92)';
      ctx.beginPath(); ctx.arc(coreX,coreY,core.r-10,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(189,184,255,.75)'; ctx.stroke();
      ctx.fillStyle=g.typePrefix?'#5ee6df':(g.variant==='A'?'#73d5ee':'#9f9af4'); ctx.font='11px "Cascadia Mono", Consolas, monospace';
      const coreText=g.typePrefix?g.typePrefix.toUpperCase():'COOL';
      ctx.fillText(coreText,coreX-ctx.measureText(coreText).width/2,coreY-3);
      const resourceRatio=g.variant==='A'
        ? Math.max(0,Math.min(1,(g.wingUnits||0)/MAX_WING_UNITS))
        : Math.max(0,Math.min(1,(g.coolerLevel||0)/9));
      ctx.strokeStyle=resourceRatio>=1?'#d7ba7d':(g.variant==='A'?'#73d5ee':'#5ee6df'); ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(coreX,coreY,Math.max(8,core.r-7),-Math.PI/2,-Math.PI/2+Math.PI*2*resourceRatio); ctx.stroke();
      ctx.lineWidth=1; ctx.fillStyle=resourceRatio>=1?'#d7ba7d':(g.variant==='A'?'rgba(115,213,238,.85)':'rgba(159,154,244,.8)');
      ctx.font='9px "Cascadia Mono", Consolas, monospace';
      const resourceText=g.variant==='A'?'BARRELS '+heavyWeaponOrigins().length:'STORM '+(1+Math.min(9,g.coolerLevel||0)*.18).toFixed(1);
      ctx.fillText(resourceText,coreX-ctx.measureText(resourceText).width/2,coreY+11);
    }
    ctx.strokeStyle='rgba(209,105,105,.35)'; ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.moveTo(0,pressureY); ctx.lineTo(W,pressureY); ctx.stroke(); ctx.setLineDash([]);
  }
  if(g.variant==='B'){
    for(const field of (g.wakeNodes||[])){
      const q=Math.max(0,Math.min(1,field.t/field.life)),fade=1-q,spin=field.spin+field.t*(1.5+field.rpm*.72);
      ctx.save();ctx.translate(field.x,field.y);
      const frost=ctx.createRadialGradient(0,0,4,0,0,field.radius);
      frost.addColorStop(0,'rgba(232,255,255,'+(.26*fade)+')');
      frost.addColorStop(.42,'rgba(121,232,226,'+(.16*fade)+')');
      frost.addColorStop(1,'rgba(83,108,193,0)');
      ctx.fillStyle=frost;ctx.beginPath();ctx.arc(0,0,field.radius,0,Math.PI*2);ctx.fill();
      ctx.rotate(spin);ctx.strokeStyle='#79e8e2';ctx.lineWidth=2.4;ctx.globalAlpha=.7*fade;
      for(const scale of[.38,.68,.94]){
        ctx.beginPath();ctx.arc(0,0,field.radius*scale,-Math.PI*.18,Math.PI*.72);ctx.stroke();
        ctx.rotate(Math.PI*.72);
      }
      ctx.strokeStyle='#e8ffff';ctx.lineWidth=1.4;ctx.globalAlpha=.78*fade;
      for(let flake=0;flake<10;flake++){
        const a=flake*Math.PI*.2+field.id*.73,r=field.radius*(.18+.7*((flake*37+field.id*11)%97)/97);
        const x=Math.cos(a)*r,y=Math.sin(a)*r*.72,len=7+field.rpm*2;
        ctx.beginPath();ctx.moveTo(x-len*.55,y-len*.25);ctx.lineTo(x+len*.55,y+len*.25);ctx.stroke();
      }
      ctx.globalAlpha=.95*fade;ctx.fillStyle='#e8ffff';ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fill();ctx.restore();
    }
    ctx.globalAlpha=1; ctx.lineWidth=1; ctx.font='15px "Cascadia Mono", Consolas, monospace';
  }
  for(const pulse of g.pulses){
    const q=Math.max(0,Math.min(1,pulse.t/pulse.life));
    ctx.globalAlpha=(1-q)*.82; ctx.strokeStyle=pulse.color; ctx.lineWidth=1+4*(1-q);
    ctx.beginPath(); ctx.arc(pulse.x,pulse.y,pulse.r,0,Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha=1; ctx.lineWidth=1;
  ctx.font = '15px "Cascadia Mono", Consolas, monospace';
  ctx.textBaseline = 'middle';
  const danger = !!g.danger;
  if (danger){   // red vignette pulses with the heartbeat
    const a = 0.05 + 0.05 * Math.abs(Math.sin(performance.now()/180));
    const grad = ctx.createLinearGradient(0, H-220, 0, H);
    grad.addColorStop(0, 'rgba(209,105,105,0)');
    grad.addColorStop(1, 'rgba(209,105,105,' + a + ')');
    ctx.fillStyle = grad;
    ctx.fillRect(0, H-220, W, 220);
  }
  const drawFocus=focusSelection(g.typePrefix), focusSet=new Set(drawFocus.candidates);
  for (const w of g.words){
    const wx = wordVisualX(w), wy = wordVisualY(w);
    const isNext = !w.resolved && w.order === g.idx;
    const incoming = w.resolved && !w.settled;
    const dmg = w.maxhp - w.hp;
    const focused=focusSet.has(w), uniqueFocus=focused && !!drawFocus.chosen;
    ctx.globalAlpha = 1;
    if(!w.settled){
      const floorNear=Math.max(0,Math.min(1,(wy-DUST_TOP)/Math.max(1,H-DUST_TOP-80)));
      const shimmer=.2+.25*floorNear+.22*Math.max(0,(w.heatPulse||0)/.18);
      ctx.globalAlpha=shimmer;ctx.strokeStyle='#f0bd67';ctx.lineWidth=1+floorNear*1.4;
      ctx.strokeRect(wx-3-floorNear*2,wy-3-floorNear*2,w.w+6+floorNear*4,w.h+6+floorNear*4);
      for(let mote=0;mote<2;mote++){
        const phase=performance.now()/650+(w.phase||0)+mote*2.7;
        ctx.fillStyle='#ffe49a';ctx.beginPath();ctx.arc(wx+w.w*(.28+.42*mote)+Math.sin(phase)*5,wy-5-Math.abs(Math.cos(phase))*7,1.3,0,Math.PI*2);ctx.fill();
      }
      ctx.globalAlpha=1;
    }
    ctx.fillStyle = focused ? (g.variant==='B'?'#1b1b42':'#102f3b') : w.err > 0 ? '#2a1010' : w.flash > 0 ? '#1e321e' : '#0b110b';
    ctx.strokeStyle = focused ? (uniqueFocus?'#5ee6df':(g.variant==='B'?'#bdb8ff':'#73d5ee')) : w.err > 0 ? '#d16969' : incoming ? '#5ee6df' : dmg > 0 ? '#6fae6f' : 'rgba(240,189,103,.62)';
    ctx.lineWidth = focused ? 3 : incoming || dmg > 0 ? 2 : 1;
    ctx.fillRect(wx, wy, w.w, w.h);
    ctx.strokeRect(wx, wy, w.w, w.h);
    if((w.rage||0)>0 && !w.resolved){
      const ragePulse=.55+.35*Math.abs(Math.sin(performance.now()/110));
      ctx.save(); ctx.globalAlpha=ragePulse; ctx.strokeStyle='#ff6e7f'; ctx.lineWidth=2+w.rage*.6;
      ctx.shadowColor='#d16969'; ctx.shadowBlur=8+w.rage*4;
      ctx.strokeRect(wx-3-w.rage,wy-3-w.rage,w.w+6+w.rage*2,w.h+6+w.rage*2);
      ctx.restore();
      ctx.fillStyle='#ff6e7f'; ctx.font='9px "Cascadia Mono", Consolas, monospace';
      ctx.fillText('RAGE '+w.rage,wx+w.w-ctx.measureText('RAGE '+w.rage).width,wy-9);
      ctx.font='15px "Cascadia Mono", Consolas, monospace';
    }
    if(focused){
      ctx.fillStyle=uniqueFocus?'#5ee6df':(g.variant==='B'?'#bdb8ff':'#73d5ee');
      ctx.font='10px "Cascadia Mono", Consolas, monospace';
      ctx.fillText(uniqueFocus?'TAB':'FOCUS',wx+5,wy-8);
      ctx.font='15px "Cascadia Mono", Consolas, monospace';
    }
    const baseCol = focused && uniqueFocus ? '#f0f3ff' : w.err > 0 ? '#f0b0b0' : (g.variant==='B'?'#dddafb':'#cbe8ef');
    if (isNext && w.consumed > 0){
      const pre = w.text.slice(0, w.consumed), rest = w.text.slice(w.consumed);
      const preW = ctx.measureText(pre).width;
      ctx.fillStyle = '#d7ba7d';
      ctx.fillText(pre, wx + 11, wy + w.h/2 + 1);
      ctx.fillStyle = baseCol;
      ctx.fillText(rest, wx + 11 + preW, wy + w.h/2 + 1);
    } else {
      ctx.fillStyle = baseCol;
      ctx.fillText(w.text, wx + 11, wy + w.h/2 + 1);
    }
    if(incoming){
      const pulse=.45+.45*Math.abs(Math.sin(performance.now()/90));
      ctx.fillStyle='rgba(94,230,223,'+pulse+')';
      ctx.beginPath(); ctx.arc(wx+w.w-8,wy+7,2.2,0,Math.PI*2); ctx.fill();
    }
    if (dmg > 0){
      ctx.strokeStyle = 'rgba(174,240,174,.5)'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(wx + w.w*0.3, wy); ctx.lineTo(wx + w.w*0.4, wy + w.h*0.6);
      if (dmg > 1){ ctx.moveTo(wx + w.w*0.7, wy + w.h); ctx.lineTo(wx + w.w*0.6, wy + w.h*0.3); }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // homing missiles: oriented streaks with glow
  ctx.strokeStyle = g.variant==='B'?'#bdb8ff':'#9fe9fb'; ctx.lineWidth = 2.5;
  ctx.shadowColor = g.variant==='B'?'#bdb8ff':'#9fe9fb'; ctx.shadowBlur = 8;
  for (const m of g.missiles){
    const d = Math.hypot(m.vx, m.vy) || 1;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(m.x - m.vx/d*13, m.y - m.vy/d*13);
    ctx.stroke();
  }
  ctx.shadowBlur = 0; ctx.lineWidth = 1;
  for(const shot of (g.escortShots||[])){
    const d=Math.hypot(shot.vx,shot.vy)||1;
    ctx.strokeStyle=shot.color||'#d7ba7d'; ctx.shadowColor=shot.color||'#d7ba7d'; ctx.shadowBlur=12; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(shot.x,shot.y); ctx.lineTo(shot.x-shot.vx/d*24,shot.y-shot.vy/d*24); ctx.stroke();
  }
  ctx.shadowBlur=0; ctx.lineWidth=1;
  // lock brackets on the current target
  if (g.lock){
    const t = g.lock, tx = wordVisualX(t), ty = wordVisualY(t), c = 7;
    ctx.strokeStyle = '#d7ba7d'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(tx-4, ty-4+c); ctx.lineTo(tx-4, ty-4); ctx.lineTo(tx-4+c, ty-4);
    ctx.moveTo(tx+t.w+4-c, ty-4); ctx.lineTo(tx+t.w+4, ty-4); ctx.lineTo(tx+t.w+4, ty-4+c);
    ctx.moveTo(tx-4, ty+t.h+4-c); ctx.lineTo(tx-4, ty+t.h+4); ctx.lineTo(tx-4+c, ty+t.h+4);
    ctx.moveTo(tx+t.w+4-c, ty+t.h+4); ctx.lineTo(tx+t.w+4, ty+t.h+4); ctx.lineTo(tx+t.w+4, ty+t.h+4-c);
    ctx.stroke(); ctx.lineWidth = 1;
  }
  const sx = g.ship.x, sy = H - 34;
  if(g.variant==='A'){
    for(const pos of wingPositions()){
      ctx.shadowColor='#73d5ee'; ctx.shadowBlur=16; ctx.fillStyle='#9fe9fb'; ctx.strokeStyle='#fff4b8'; ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(pos.x,pos.y-19);ctx.lineTo(pos.x-18,pos.y+10);ctx.lineTo(pos.x-8,pos.y+6);
      ctx.lineTo(pos.x,pos.y+13);ctx.lineTo(pos.x+8,pos.y+6);ctx.lineTo(pos.x+18,pos.y+10);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle='#73d5ee';ctx.lineWidth=3;
      for(const dx of[-12,0,12]){ctx.beginPath();ctx.moveTo(pos.x+dx,pos.y-13-Math.abs(dx)*.12);ctx.lineTo(pos.x+dx,pos.y-24-Math.abs(dx)*.12);ctx.stroke();}
      ctx.fillStyle='rgba(215,186,125,'+(0.35+Math.random()*.45)+')'; ctx.fillRect(pos.x-3,pos.y+12,6,6+Math.random()*5);
    }
    ctx.shadowBlur=0; ctx.lineWidth=1;
  }
  ctx.globalAlpha = performance.now() < (g.hitInvulnUntil || 0)
    ? (.35 + .35*Math.abs(Math.sin(performance.now()/70))) : 1;
  ctx.shadowColor = g.variant === 'B' ? '#bdb8ff' : '#73d5ee'; ctx.shadowBlur = 14;
  ctx.fillStyle = g.variant === 'B' ? '#bdb8ff' : '#73d5ee';
  ctx.beginPath();
  ctx.moveTo(sx, sy - 14); ctx.lineTo(sx - 11, sy + 10); ctx.lineTo(sx, sy + 4); ctx.lineTo(sx + 11, sy + 10);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(215,186,125,' + (0.4 + Math.random()*0.5) + ')';
  ctx.fillRect(sx - 2, sy + 10, 4, 5 + Math.random()*6);
  ctx.globalAlpha = 1;
  for(const mote of (g.scoreMotes||[])){
    if(mote.t<0) continue;
    const q=Math.max(0,Math.min(1,mote.t/mote.life));
    ctx.globalAlpha=1-q*.25; ctx.fillStyle='#fff4b8'; ctx.shadowColor='#f0bd67'; ctx.shadowBlur=10;
    const size=3+2*(1-q); ctx.save(); ctx.translate(mote.x,mote.y); ctx.rotate(Math.PI/4+q*2); ctx.fillRect(-size/2,-size/2,size,size); ctx.restore();
  }
  ctx.globalAlpha=1; ctx.shadowBlur=0;
  for (const p of g.parts){
    const a = 1 - p.t/p.life;
    ctx.globalAlpha = a;
    if (p.text){
      ctx.fillStyle = p.color;
      ctx.font = '13px "Cascadia Mono", Consolas, monospace';
      ctx.fillText(p.text, p.x, p.y);
      ctx.font = '15px "Cascadia Mono", Consolas, monospace';
    } else {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }
}

// ---------- input ----------
let lastMode = 'tap';
function begin(mode){ lastMode = mode; startGame(mode); }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  tapAt(e.clientX - r.left, e.clientY - r.top);
});
cv.addEventListener('pointermove', e => {
  if (!g || g.over || g.viewportPaused) return;
  // Both tests use the mouse strictly as an aiming cursor on desktop so held arrows can dodge
  // independently while the player points at and clicks a chunk. Touch drag still steers.
  if (e.pointerType === 'mouse') return;
  const r = cv.getBoundingClientRect();
  g.ship.x = Math.max(16,Math.min(W-16,e.clientX-r.left));
  g.ship.manualUntil = performance.now()+500;
});
$('start').addEventListener('pointerdown', e => { e.preventDefault(); begin('tap'); });
$('over').addEventListener('pointerdown', e => { e.preventDefault(); begin(lastMode); });
window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!$('start').classList.contains('hidden')){
    e.preventDefault(); begin(e.key.length===1?'type':'tap');
    if(e.key.length===1&&SIG.test(e.key))handleKey(e.key);
    return;
  }
  if (!$('over').classList.contains('hidden')){
    e.preventDefault(); begin(lastMode);
    return;
  }
  if (e.key === 'Tab'){ e.preventDefault(); handleTab(); return; }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
    e.preventDefault();
    const side = e.key === 'ArrowLeft' ? 'left' : 'right';
    if (!moveInput[side]){
      const nudge = side === 'left' ? -20 : 20;
      const beforeNudge=g.ship.x;
      g.ship.x = Math.max(16,Math.min(W-16,g.ship.x+nudge));
      castWakeFromMovement(beforeNudge,g.ship.x,0,true);
    }
    moveInput[side] = true;
    return;
  }
  if (e.key.length === 1 || e.key === 'Backspace'){ e.preventDefault(); handleKey(e.key); }
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft') moveInput.left = false;
  if (e.key === 'ArrowRight') moveInput.right = false;
});
window.addEventListener('blur', () => { moveInput.left = false; moveInput.right = false; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ moveInput.left = false; moveInput.right = false; }
});
$('start-best').textContent = 'best: ' + (+(localStorage.getItem('shooter2_best') || 0));
resize();
</script>
