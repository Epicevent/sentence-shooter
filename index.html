<style>

    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;

  .overlay .tap { color: var(--gold); letter-spacing: 3px; animation: blink 1.2s steps(1) infinite; }

    const choices = [...item.answer,...(item.decoys||[])];
    if (!item.ask || !item.answer.length) throw new Error('invalid TOEFL item: '+item.id);
    for (let i=0;i<choices.length;i++) for (let j=i+1;j<choices.length;j++){
      if (typingForm(choices[i]) === typingForm(choices[j]) && choiceIdentity(choices[i]) !== choiceIdentity(choices[j]))
        throw new Error('typing collision in '+item.id+': '+choices[i]+' / '+choices[j]);
    }
  }
}
validateItems(ITEMS);

function pickSentence(){
  const lv = Math.min(3, 1 + Math.floor(g.solved / 4));
  const len = item => item.answer.length;
  let cands = ITEM_ORDER.filter(item => !g.recent.includes(item.id));
  if (!cands.length){ g.recent = []; cands = ITEM_ORDER.slice(); }
  const tier = cands.filter(item => lv===1 ? len(item)<=4 : lv===2 ? len(item)>=4 : len(item)>=5);
  const use = tier.length ? tier : cands;
  return use[0];
}

function replyText(count, cursor){
  if (!g || !g.sentence) return '';
  const item = g.item || { lead:'', tail:'' };
  const pieces = [];
  if (item.lead) pieces.push(item.lead);
  pieces.push(...g.sentence.slice(0, count));
  if (cursor && count < g.sentence.length) pieces.push('▁');
  let text = pieces.filter(Boolean).join(' ');
  if (count >= g.sentence.length && item.tail) text += item.tail;
  return text.trim();
}

function fullReply(){ return replyText(g.sentence.length, false); }

function nextSentence(){
  // Do not let a fast clear erase the tail of its own hit animation. Any volley that has
  // not physically arrived by the transition deadline lands as a final cleanup blast.
  for (const w of g.words.slice()) if (w.resolved && !w.settled) settleWord(w, true);
  const item = pickSentence();
  g.recent.push(item.id); if (g.recent.length > 12) g.recent.shift();
  g.item = item;
  g.sentence = item.answer.slice();
  g.idx = 0; g.t0 = performance.now(); g.perfect = true; g.typePrefix = ''; g.pendingSentenceClear=false;
  g.shotJamUntil = 0; g.lastMissAt = 0; g.missChain = 0;
  g.waveGraceUntil = g.t0 + 2200;
  g.enemyFireT = variantRules(g.variant).fireStart;
  g.recoilBank = 0;
  g.visualPhase = 0; g.escortShots = [];
  if (g.viewportPaused) g.viewportPauseAt = g.t0;
  const rules = variantRules(g.variant);
  g.speed = Math.min(rules.speedCap,rules.baseSpeed*Math.pow(rules.solvedScale,g.solved));
  g.wordT = 0;
  g.words = []; g.missiles = []; g.enemyShots = []; g.fireQueues = []; g.lock = null;
  ctx.font = '15px "Cascadia Mono", Consolas, monospace';
  const offered = [
    ...item.answer.map((text, order) => ({ text, order, isDecoy:false })),
    ...(item.decoys || []).map((text, i) => ({ text, order:item.answer.length+i, isDecoy:true })),
  ];
  const perRow = g.variant === 'B' ? (W < 520 ? 1 : 2) : perRowForWidth(), margin = 8;
  g.perRow = perRow;
  const slots = offered.map((w, i) => i);
  const layoutRng = makeRng(AB_SEED ^ textSeed(item.id));
  for (let i = slots.length - 1; i > 0; i--){ const j = Math.floor(layoutRng()*(i+1)); [slots[i], slots[j]] = [slots[j], slots[i]]; }
  offered.forEach((piece, pieceIndex) => {
    const { text, order, isDecoy } = piece;
    const slot = slots[pieceIndex];
    const row = Math.floor(slot/perRow), col = slot%perRow;
    const laneW = (W - margin*2) / perRow;
    const tw = ctx.measureText(text).width, bw = Math.min(laneW - 10, tw + 22), bh = 34;
    const jitterX = layoutRng()*12-6;
    const x = Math.max(margin, Math.min(W - margin - bw, margin + col*laneW + (laneW-bw)/2 + jitterX));
    const rows = Math.ceil(offered.length/perRow), top = W < 520 ? 104 : 132;
    const safeBottom = Math.max(top,(H-64)-wingHoldClearance()-bh-6);
    const bottom = g.variant==='B' && W>=520 ? Math.max(top,Math.min(safeBottom,H-250)) : safeBottom;
    const rowGap = rows > 1 ? Math.min(58,(bottom-top)/(rows-1)) : 0;
    const y = top + row * rowGap;
    const hp = sigLen(text);   // unified: letters are HP in both input styles
    g.words.push({
      text, order, x, y, w: bw, h: bh, hp, maxhp: hp, flash: 0, consumed: 0,
      committed: 0, resolved: false, resolvedAt: 0, settled: false, pts: 0,
      row, col, slot, jitterX, holding: false, threatY: null, isDecoy, baseX:x,
      phase:layoutRng()*Math.PI*2, firedAt:0,
    });
  });
  tEv('sentence_start', { solved: g.solved, speed: roundTrace(g.speed), variant:g.variant,
    item:item.id, source:item.source||null, ask:item.ask, lead:item.lead, tail:item.tail, answer_count:item.answer.length,
    words: g.words.map(w => [w.order, w.text, roundTrace(w.x), roundTrace(w.y),
      roundTrace(w.w), roundTrace(w.h), w.maxhp, w.isDecoy ? 1 : 0]) });
  updateHud();
}

function updateReserveHud(){

    ' R' + Math.round(g.recoilBank || 0) + (g.variant === 'B' ? ' · SYNC ' + Math.round(g.sync || 0) : '');

function shake(){

function spawnParts(x, y, n, color, spd){

    const a = Math.random()*Math.PI*2, v = spd*(0.4 + Math.random());

function popText(x, y, text, color){

function equivalentTarget(word){
  if (!word || word.order === g.idx) return word;
  const target = g.words.find(w => !w.resolved && w.order === g.idx);
  if (!target || choiceIdentity(target.text) !== choiceIdentity(word.text)) return word;
  const oldOrder = word.order;
  word.order = target.order;
  target.order = oldOrder;
  const oldDecoy = word.isDecoy;
  word.isDecoy = target.isDecoy;
  target.isDecoy = oldDecoy;
  tEv('equivalent_swap', { text:word.text, selected:oldOrder, target:g.idx });
  return word;
}

function spawnEnemyShot(word, angry){
  if (!word || word.resolved) return;
  const x = wordVisualX(word) + word.w/2, y = wordVisualY(word) + word.h;
  const aimX = Math.max(18, Math.min(W-18, g.ship.x + (Math.random()*70-35)));
  const dx = aimX-x, dy = Math.max(80, H-34-y), d = Math.hypot(dx,dy) || 1;
  const rules = variantRules(g.variant);
  const speed = rules.enemySpeed + Math.min(rules.enemyGrowthCap,g.solved*rules.enemyGrowth) + (angry ? 55 : 0);
  g.enemyShots.push({ x,y, vx:dx/d*speed, vy:dy/d*speed, r:angry?5:4, source:word.order });
  tone(150, 105, .045, 'sawtooth', .025);
}

function clearEnemyShots(x, y, radius){

    cleared++;
    spawnParts(s.x,s.y,3,'#d7ba7d',70);

}

function addPulse(x,y,maxR,color,life){

function awardGraze(shot){

function applyPhysicalImpact(word,x,y,forced){

function takeShipHit(){
  const now = performance.now();
  if (!g || g.over || now < (g.hitInvulnUntil || 0)) return;
  g.hitInvulnUntil = now + 950;
  // Being clipped while dodging must not turn the player's next confirm into an
  // accidental stocked auto-build. Keep the visible candidate focus through recoil.
  g.perfect = false; g.combo = 0;
  g.shotJamUntil = 0; g.missChain = 0;
  const syncBefore=g.sync||0;
  if(g.variant==='B') g.sync=Math.max(0,syncBefore-40);
  const shielded = g.shields > 0;
  if (shielded) g.shields--;
  else g.lives--;
  spawnParts(g.ship.x,H-34,18,'#d16969',190); shake(); buzz(shielded?55:110);
  clearEnemyShots(g.ship.x,H-34,9999);
  tEv('ship_hit', { shielded, shields:g.shields, lives:g.lives, variant:g.variant,
    sync_before:syncBefore, sync_after:g.sync||0 });
  if (g.lives <= 0){ gameOver(); return; }
  recoilFormation(shielded ? 'shield_fire' : 'life_fire');
  banner(shielded ? 'SHIELD PARRY' : 'SHIP HIT', shielded);
  $('msg').innerHTML = shielded
    ? '<span style="color:var(--gold)">🛡 hostile fire blocked</span>'
    : '<span style="color:var(--danger)">✦ hit!</span> keep building — ' + g.lives + ' ships left';
  updateHud();
}

function inputJammed(kind){
  const left = Math.max(0,Math.ceil(((g && g.shotJamUntil) || 0)-performance.now()));
  if (!left) return false;
  tEv('input_jammed', { kind, remaining:left, scene:traceScene() });
  $('msg').innerHTML = '<span style="color:var(--danger)">WEAPONS JAMMED</span> — dodge for ' + left + 'ms';
  return true;
}

function applyWrongPenalty(chosen, detail){
  const now = performance.now();
  const rules = variantRules(g.variant);
  g.missChain = now - (g.lastMissAt || 0) < 1200 ? Math.min(3,(g.missChain || 0)+1) : 1;
  g.lastMissAt = now;
  const chain = g.missChain;
  const jam = rules.wrongJamBase + chain*rules.wrongJamChain;
  g.shotJamUntil = now + jam;
  g.missGraceUntil = now + MISS_BURST_MS;
  g.typePrefix = ''; g.plinks++; g.combo = 0; g.perfect = false;
  g.score = Math.max(0,g.score-50*chain);
  if (chosen) chosen.err = .55;

  const lunge = rules.wrongLungeBase + chain*rules.wrongLungeChain;
  for (const word of g.words) word.y += lunge;
  const target = g.words.find(word => !word.resolved && word.order === g.idx);
  if (target && Number.isFinite(target.threatY)) target.threatY += lunge;
  const timeLost = 0;
  const bankLost = Math.min(g.recoilBank || 0,12*chain);
  g.recoilBank = Math.max(0,(g.recoilBank || 0)-bankLost);

  const shooters = g.words.filter(word => !word.resolved);
  const source = chosen && !chosen.resolved ? chosen : shooters[Math.floor(Math.random()*shooters.length)];
  const retaliation = source ? rules.retaliationBase + chain : 0;
  for (let i=0;i<retaliation;i++) spawnEnemyShot(source,true);
  tEv('miss', Object.assign({
    order:chosen ? chosen.order : null, w:chosen ? chosen.text : '', chain, jam, retaliation,
    lunge, time_lost:roundTrace(timeLost), bank_lost:roundTrace(bankLost), scene:traceScene(),
  },detail || {}));
  sfx.plink(); shake(); buzz(35);
  $('msg').innerHTML = '<span style="color:var(--danger)">✗ WRONG — JAM ' + jam + 'ms</span>' +
    (retaliation ? ' · retaliation ×' + retaliation : '') +
    (timeLost ? ' · -' + timeLost.toFixed(1) + 's' : ' · siege advances') + ' · keep dodging';
  updateHud();
}

// tap-to-lock, ZType style: the ship fires a stream of homing missiles at the locked word
function tapAt(x, y){
  if (!g || g.over || g.viewportPaused) return;   // keyboard and pointer both live when play is visible
  // A resolved word remains visible for its impacts, but is no longer an input target.
  const now = performance.now();
  if (inputJammed('tap')) return;
  const live = g.words.filter(w => !w.resolved);
  let w = live.find(w => {
    const wx = wordVisualX(w, now), wy = wordVisualY(w, now);
    return x >= wx && x <= wx + w.w && y >= wy && y <= wy + w.h;
  });
  // Padding makes narrow/mobile blocks easier to hit, but adjacent padded boxes can overlap.
  // In that fringe choose the visually nearest block instead of array order (which leaks answer order).
  if (!w){
    w = live.filter(word => {
      const wx = wordVisualX(word, now), wy = wordVisualY(word, now);
      return x >= wx - 8 && x <= wx + word.w + 8 && y >= wy - 8 && y <= wy + word.h + 8;
    }).sort((a,b) => {
      const ax=wordVisualX(a,now)+a.w/2, ay=wordVisualY(a,now)+a.h/2;
      const bx=wordVisualX(b,now)+b.w/2, by=wordVisualY(b,now)+b.h/2;
      return Math.hypot(x-ax,y-ay)-Math.hypot(x-bx,y-by);
    })[0];
  }
  if (!w) return;
  w = equivalentTarget(w);
  tEv('tap_input', { x: roundTrace(x), y: roundTrace(y), order: w.order, w: w.text,
    correct: w.order === g.idx, scene: traceScene() });
  g.typePrefix = ''; g.lock = null;
  if (w.order === g.idx){
    g.missChain = 0;
    g.lock = w;
    queueDamageVolley(w, w.maxhp - w.committed);   // one tap commits a full kill; visuals follow independently
    tone(600, 900, .06, 'square', .05);            // lock blip
  } else {
    applyWrongPenalty(w,{ want:(g.words.find(word=>word.order===g.idx)||{}).text });
  }
}

function launchMissile(target, dmg, letter){
  g.missiles.push({
    x: g.ship.x + (Math.random()*14 - 7), y: H - 46,
    vx: (Math.random()*2 - 1) * 260,          // flare out sideways...
    vy: -220 - Math.random()*120,             // ...then curve into the target
    target, dmg, letter,
  });
}

// Gameplay is committed when a deterministic shot is launched/scheduled. The missile and
// explosion are presentation: they may finish later without holding the next input hostage.
function commitMissile(target, letter){
  if (!target || target.resolved) return;
  target.committed++;
  launchMissile(target, 1, letter);
  if (target.committed >= target.maxhp) resolveWord(target);
}

function queueDamageVolley(target, count){
  count = Math.max(0, count | 0);
  if (!count || !target || target.resolved) return;
  const gap = volleyGap();
  target.committed += count;                         // deterministic reservation: this damage cannot be canceled
  g.fireQueues.push({ target, remaining: count, t: 0, gap });
  if (target.committed >= target.maxhp) resolveWord(target);
}

function spawnMissiles(dt){
  for (const q of g.fireQueues){
    if (!g.words.includes(q.target)){ q.remaining = 0; continue; }
    q.t -= dt;
    while (q.remaining > 0 && q.t <= 0){
      q.remaining--;
      q.t += q.gap;
      sfx.pew();
      launchMissile(q.target, 1);
    }
  }
  g.fireQueues = g.fireQueues.filter(q => q.remaining > 0);
}

function advanceTypedKey(t, key){
  if (!t || t.resolved || t.consumed >= t.text.length) return false;
  const expected = t.text[t.consumed];
  if (expected.toLowerCase() !== key.toLowerCase()) return false;
  tEv('key_input', { order:t.order, k:key, w:t.text, at:t.consumed, scene:traceScene() });
  g.missGraceUntil = 0;
  g.lock = t;
  t.consumed++;
  sfx.pew();
  commitMissile(t, expected);
  while (t.consumed < t.text.length && !SIG.test(t.text[t.consumed])){
    t.consumed++;                            // commas and periods ride along as free missiles
    launchMissile(t, 0);
  }
  for (let i = 1; i < weaponLv(); i++) launchMissile(t, 0);
  return true;
}

function suppressTypedMiss(chosen, key, guess, expected){
  const now = performance.now();
  tEv('miss_suppressed', {
    order: chosen ? chosen.order : null, k:key, want:expected || undefined,
    w:chosen ? chosen.text : '', guess:guess || '',
    remaining:Math.max(0,Math.round(g.missGraceUntil-now)), scene:traceScene(),
  });
}

function penalizeTypedGuess(chosen, key, guess, expected){
  applyWrongPenalty(chosen,{ k:key, want:expected || undefined, guess:guess || '' });
}

function focusCandidates(prefix){
  if (!g || !prefix) return [];
  const normalized=String(prefix).toLowerCase();
  return g.words.filter(w=>!w.resolved && typingForm(w.text).startsWith(normalized));
}
function focusSelection(prefix){
  const candidates=focusCandidates(prefix);
  const forms=[...new Set(candidates.map(w=>choiceIdentity(w.text)))];
  if (forms.length!==1) return { candidates, forms, chosen:null };
  const target=g.words.find(w=>!w.resolved&&w.order===g.idx);
  const chosen=target && forms[0]===choiceIdentity(target.text) ? target : candidates[0];
  return { candidates, forms, chosen };
}
function describeFocus(){
  if (!g.typePrefix){ $('msg').textContent='# focus cleared — type to light matching chunks'; return; }
  const state=focusSelection(g.typePrefix);
  if (state.forms.length===1){
    $('msg').innerHTML='<span style="color:var(--bright)">FOCUS '+esc(g.typePrefix.toUpperCase())+'</span> · '+
      state.candidates.length+' target'+(state.candidates.length===1?'':'s')+' · <span style="color:var(--gold)">TAB TO CONFIRM</span>';
  } else {
    $('msg').innerHTML='<span style="color:var(--bright)">FOCUS '+esc(g.typePrefix.toUpperCase())+'</span> · '+
      state.candidates.length+' candidates · keep typing to narrow';
  }
}

// Typing only builds a visible candidate focus. It never judges grammar by itself.
function handleKey(key){
  if (!g || g.over || g.viewportPaused) return;
  if (key==='Backspace'){
    if (!g.typePrefix) return;
    g.typePrefix=g.typePrefix.slice(0,-1); g.lock=null;
    const state=focusSelection(g.typePrefix);
    if (state.chosen) g.lock=state.chosen;
    tEv('focus_change',{ prefix:g.typePrefix, candidates:state.candidates.map(w=>w.order),
      reason:'backspace', scene:traceScene() });
    describeFocus(); return;
  }
  if (key.length!==1 || !SIG.test(key)) return;
  if (inputJammed('type')) return;
  const attempted=(g.typePrefix+key).toLowerCase();
  const candidates=focusCandidates(attempted);
  tEv('key_input',{ order:null, k:key, prefix:g.typePrefix, attempted, scene:traceScene() });
  if (!candidates.length){
    const rejected=attempted; g.typePrefix=''; g.lock=null;
    tEv('focus_clear',{ rejected, reason:'no_match', scene:traceScene() });
    tone(180,120,.05,'square',.025);
    $('msg').innerHTML='<span style="color:var(--dim)">NO MATCH '+esc(rejected.toUpperCase())+'</span> — focus cleared, no penalty';
    return;
  }
  g.typePrefix=attempted; g.missGraceUntil=0;
  const state=focusSelection(g.typePrefix);
  g.lock=state.chosen;
  tEv('type_prefix',{ prefix:g.typePrefix, candidates:candidates.map(w=>w.order),
    unique:state.chosen ? state.chosen.order : null, scene:traceScene() });
  tone(state.chosen?520:340,state.chosen?760:430,.045,'square',.025);
  describeFocus();
}

// With a focus, Tab confirms for free and only then judges. With no focus, Tab spends ⚡ to auto-build.
function handleTab(){
  if (!g || g.over || g.viewportPaused) return;
  if (inputJammed('tab')) return;
  if (g.typePrefix){
    const prefix=g.typePrefix, state=focusSelection(prefix);
    if (!state.chosen){
      tEv('focus_confirm_blocked',{ prefix, candidates:state.candidates.map(w=>w.order), scene:traceScene() });
      sfx.plink(); describeFocus(); return;
    }
    const chosen=equivalentTarget(state.chosen), correct=chosen.order===g.idx;
    tEv('focus_confirm',{ prefix, order:chosen.order, w:chosen.text, correct, scene:traceScene() });
    g.typePrefix=''; g.lock=null;
    if (correct){
      g.missChain=0; g.lock=chosen;
      queueDamageVolley(chosen,chosen.maxhp-chosen.committed);
      tone(600,900,.06,'square',.05);
    } else applyWrongPenalty(chosen,{ guess:prefix, confirm:'tab' });
    updateHud(); return;
  }
  const t=g.words.find(w=>w.order===g.idx);
  if (!t) return;
  if (g.tabs<=0){
    sfx.plink(); $('msg').textContent='# no ⚡ left — every 4 manual kills or a PERFECT refill it'; return;
  }
  g.tabs--; g.perfect=false; g.missChain=0; t.auto=true; g.lock=t;
  tEv('tab',{ order:t.order, w:t.text, at:t.consumed||(t.maxhp-t.hp), left:g.tabs,
    d:Math.round((H-64)-((Number.isFinite(t.threatY)?t.threatY:t.y)+t.h)), scene:traceScene() });
  tone(300,900,.12,'square',.06);
  queueDamageVolley(t,t.maxhp-t.committed);
  updateHud();
}

// OpenTyrian's galaga-mode rule (tyrian2.c:1147): score thresholds grant lives,
// each threshold recedes, and a full stock converts to points instead of vanishing
function checkExtraLife(){
  while (g.score >= g.nextLife){
    if (g.lives < 5){ g.lives++; banner('1UP', true); sfx.up(); buzz([30,50,30]); }
    else g.score += 1000;
    g.nextLife += 25000;
  }
}

function awardTabs(count, reason, overflowPoints){
  const room = Math.max(0, TAB_CAP - g.tabs);
  const gained = Math.min(count, room), overflow = count - gained;
  if (gained > 0){
    g.tabs += gained;
    tEv('item_gain', { item:'tab', reason, amount:gained, left:g.tabs });
  }
  if (overflow > 0){
    const points = overflow * overflowPoints;
    g.score += points;
    tEv('item_overflow', { item:'tab', reason, amount:overflow, left:g.tabs, points });
  }
  return { gained, overflow, points:overflow * overflowPoints };
}

function applyCorrectDefense(word,nextTarget){
  const rules = variantRules(g.variant);
  // VECTOR keeps its legacy instant parry. The selected CORE game waits for the
  // reserved missiles to physically kill the word before releasing its parry.
  const cleared = g.variant==='A' && rules.clearRadius
    ? clearEnemyShots(wordVisualX(word)+word.w/2,wordVisualY(word)+word.h/2,
      rules.clearRadius+Math.min(70,g.combo*7))
    : 0;
  const requestedKick = rules.kickBase + Math.min(rules.kickCap,g.combo*rules.kickCombo);
  const recoilAt = performance.now(), movement = [];
  const liveWords = g.words.filter(live => !live.resolved);
  const available = liveWords.length ? Math.max(0,Math.min(...liveWords.map(live=>live.y-104))) : 0;
  const kick = Math.min(requestedKick,available);
  g.recoilBank += requestedKick-kick;
  for (const live of liveWords)
    movement.push(beginWordRecoil(live,live.y-kick,recoilAt,null,false));
  if (nextTarget) nextTarget.threatY = nextTarget.y;
  tEv('earned_recoil', { variant:g.variant, requested:requestedKick, kick,
    bank:roundTrace(g.recoilBank), cleared, combo:g.combo, remaining:liveWords.length, movement });
  const effect = cleared ? 'PARRY '+cleared+' · ' : '';
  const pushText = kick >= 1 ? 'PUSH -'+Math.round(kick) : 'PRESSURE BANKED';
  popText(W/2,Math.max(104,wordVisualY(word)),effect+pushText+
    (g.recoilBank >= 1 ? '  R'+Math.round(g.recoilBank) : ''),'#aef0ae');
}

function resolveWord(word){
  if (!word || word.resolved || word.order !== g.idx) return;
  word.resolved = true;
  word.resolvedAt = performance.now();
  g.missGraceUntil = 0;
  g.lastMissAt = 0; g.missChain = 0;
  g.typePrefix = '';
  if (g.lock === word) g.lock = null;
  g.kills++; g.idx++; g.wordT = 0;
  const nextTarget = g.words.find(w => !w.resolved && w.order === g.idx);
  if (nextTarget) nextTarget.threatY = nextTarget.y;
  if (!word.auto){
    g.combo++;
    if (g.combo % TAB_COMBO_STEP === 0){
      const reward = awardTabs(1, 'combo' + g.combo, 300);
      if (reward.gained){ banner('+1 ⚡ — COMBO ' + g.combo, true); sfx.up(); }
      else banner('⚡ FULL +' + reward.points, true);
    }
  }
  applyCorrectDefense(word,nextTarget);
  const finalChunk=g.idx===g.sentence.length;
  $('msg').innerHTML = finalChunk
    ? '<span style="color:var(--bright)">✓ ANSWER LOCKED</span> — final impact inbound'
    : '<span style="color:var(--bright)">✓ CORRECT</span> — breach pushed back; choose the next chunk';
  const lvBefore = WEAPONS[weaponLv()-1];
  // long words are the fun AND the danger (trace-verified: all deaths were long words) — pay accordingly
  const base = 60 + 9 * word.maxhp;
  const pts = Math.round((word.auto ? base/2 : base) * (1 + Math.min(12, g.combo)*0.1));
  word.pts = pts;
  g.score += pts;
  tEv('kill', { order:word.order, w: word.text, auto: !!word.auto, c: g.combo, pts });
  checkExtraLife();
  if (g.score > g.best){ g.best = g.score; localStorage.setItem('shooter2_best', g.best); }
  const lvAfter = WEAPONS[weaponLv()-1];
  if (lvAfter !== lvBefore){ banner('WEAPON UP — ' + lvAfter, true); sfx.up(); buzz([20,40,20]); }
  if (finalChunk) g.pendingSentenceClear=true;
  updateHud();
}

function settleWord(word, forced){
  if (!word || word.settled) return;
  const visualX = wordVisualX(word), visualY = wordVisualY(word);
  word.settled = true;
  g.words = g.words.filter(w => w !== word);
  if (g.lock === word) g.lock = null;
  const lag = Math.max(0, Math.round(performance.now() - word.resolvedAt));
  const impact=applyPhysicalImpact(word,visualX+word.w/2,visualY+word.h/2,forced);
  tEv('settle', { order:word.order, w: word.text, lag, forced: !!forced,
    impact_cleared:impact.cleared, core_burst:impact.burst });
  sfx.boom(); buzz(25); shake();
  spawnParts(visualX + word.w/2, visualY + word.h/2, 14, '#d7ba7d', 160);
  spawnParts(visualX + word.w/2, visualY + word.h/2, 8, '#aef0ae', 90);
  popText(visualX + word.w/2, visualY, '+' + word.pts, '#d7ba7d');
  if(!forced && word.order===g.sentence.length-1 && g.pendingSentenceClear && g.idx===g.sentence.length){
    g.pendingSentenceClear=false;
    sentenceClear();
  }
}

function sentenceClear(){
  for (const decoy of g.words.slice()){
    if (!decoy.resolved && decoy.isDecoy){
      decoy.resolved = true; decoy.resolvedAt = performance.now(); decoy.pts = 0;
      settleWord(decoy, true);
    }
  }
  clearEnemyShots(W/2,H/2,9999);
  g.solved++;
  const secs = Math.round((performance.now() - g.t0)/1000);
  const bonus = Math.max(0, 150 - secs*4);
  const reserveBonus = Math.round((g.recoilBank||0)*4);
  if (reserveBonus) tEv('reserve_bonus',{ bank:roundTrace(g.recoilBank), points:reserveBonus });
  g.recoilBank = 0;
  g.score += bonus + reserveBonus;
  if (g.score > g.best){ g.best = g.score; localStorage.setItem('shooter2_best', g.best); }
  sfx.clear();
  let earned = '';
  if (g.perfect){
    const reward = awardTabs(2, 'perfect', 500);
    const rewardText = reward.gained ? '+' + reward.gained + '⚡' : '⚡ FULL';
    banner('PERFECT ' + rewardText + (reward.points ? ' +' + reward.points : ''), true);
    if (reward.gained){
      earned = '  <span style="color:var(--gold)">+' + reward.gained + ' ⚡ (perfect)</span>'; sfx.up();
    }
    if (reward.points){
      earned += '  <span style="color:var(--gold)">⚡ FULL +' + reward.points + '</span>';
    }  // OpenTyrian consolation-prize rule
  } else banner('CLEAR');
  if (secs <= Math.ceil(g.sentence.length * 2.8)){   // speed mastery pays out in shields
    if (g.shields < 2){
      g.shields++; tEv('item_gain', { item: 'shield', reason: 'fast_clear', left: g.shields });
      earned += '  <span style="color:var(--gold)">+1 🛡 (fast clear)</span>';
    } else {
      g.score += 300;
      tEv('item_overflow', { item: 'shield', reason: 'fast_clear', left: g.shields, points: 300 });
    }
  }
  checkExtraLife();
  tEv('clear', { len: g.sentence.length, secs, perfect: g.perfect });
  $('msg').innerHTML = '<span style="color:var(--bright)">✓ ' + esc(fullReply()) + '</span> +' + bonus +
    (reserveBonus ? ' <span style="color:var(--gold)">+R' + reserveBonus + '</span>' : '') + earned;
  setTimeout(()=>{ if (g && !g.over) nextSentence(); }, 700);
}

function loseLife(word){
  // Preserve an in-progress focus through a formation breach so the next Tab
  // remains a confirmation instead of consuming a stocked assist.
  g.perfect = false; g.wordT = 0;
  if (g.shields > 0){   // shield repels the breakthrough: ship, gun and combo survive
    const transitionAt=performance.now(), before = traceScene(transitionAt);
    g.shields--;
    recoilFormation('shield',false,transitionAt);
    banner('SHIELD', true); tone(220, 660, .18, 'square', .09); buzz(60);
    const after = traceScene(transitionAt);
    tEv('shield_absorb', { order:word.order, w: word.text, effect: 'recoil', left: g.shields, before, after });
    $('msg').innerHTML = '<span style="color:var(--gold)">🛡 shield absorbed the breach</span>';
    updateHud(); return;
  }
  const transitionAt=performance.now(), before = traceScene(transitionAt);
  sfx.hit(); buzz(120); shake();
  g.lives--; g.combo = 0;
  spawnParts(g.ship.x, H - 40, 20, '#d16969', 200);
  if (g.lives <= 0){
    tEv('life_lost', { order:word.order, w: word.text, left: g.lives, before, after: traceScene(transitionAt) });
    gameOver(); return;
  }
  $('msg').innerHTML = '<span style="color:var(--danger)">✦ breach!</span> gun reset — ' + g.lives + ' ships left';
  recoilFormation('life',false,transitionAt);
  tEv('life_lost', { order:word.order, w: word.text, left: g.lives, before, after: traceScene(transitionAt) });
  updateHud();
}

// (the 💡 reveal item was removed — a skill that tells you the answer betrays the drill)

function gameOver(){
  g.over = true;
  if (g.score > g.best){ g.best = g.score; localStorage.setItem('shooter2_best', g.best); }
  const acc = (g.kills + g.plinks) ? Math.round(100 * g.kills / (g.kills + g.plinks)) : 100;
  if (traceOn) traceSample(g.eff || g.speed);
  tEv('over', { score: g.score, solved: g.solved, acc, kills: g.kills, plinks: g.plinks,
    tabs: g.tabs, shields: g.shields });
  traceSend();
  $('over-stats').innerHTML =
    'score <b style="color:var(--gold)">' + g.score + '</b><br>' +
    'sentences cleared: ' + g.solved + '<br>' +
    'aim discipline: ' + acc + '% (kills vs armor plinks)<br>' +
    'best: ' + g.best;
  $('over').classList.remove('hidden');
  updateHud();
}

function frame(now){
  if (!g) return;
  const dt = Math.min(0.05, (now - g.lastT)/1000); g.lastT = now;
  if (!g.over){
    if (!g.viewportPaused) update(dt);
    draw();
    traceAcc += dt;
    if (traceAcc >= 0.125){ traceAcc %= 0.125; traceSample(g.eff || g.speed); }
  }
  requestAnimationFrame(frame);
}

function update(dt){
  if (g.viewportPaused) return;
  if (g.freeze > 0){ g.freeze -= dt; return; }   // hit-stop
  for (const s of g.stars){ s.y += s.v*dt; if (s.y > H){ s.y = -2; s.x = Math.random()*W; } }
  g.wordT += dt;
  const siege = true, rules = variantRules(g.variant);
  const eff = g.speed + Math.min(rules.hesitationCap,g.wordT*rules.hesitationAccel);
  g.eff = eff;
  const now = performance.now(), active = now >= (g.waveGraceUntil || 0);
  const moveDir = (moveInput.right?1:0)-(moveInput.left?1:0);
  if (moveDir){
    g.ship.x = Math.max(16,Math.min(W-16,g.ship.x+moveDir*330*dt));
    g.ship.manualUntil = now+180;
  }
  if (g.variant === 'B') g.visualPhase += dt*.9;
  const deadline = H - 64, rawStep = active && siege ? eff * dt : 0;
  const bankSpend = siege ? Math.min(rawStep,g.recoilBank || 0) : 0;
  if (bankSpend){ g.recoilBank -= bankSpend; updateReserveHud(); }
  const fullStep = rawStep-bankSpend;
  const target = g.words.find(w => !w.resolved && w.order === g.idx);
  if (target && siege){
    if (!Number.isFinite(target.threatY)) target.threatY = target.y;
    target.threatY += fullStep;
  }
  const future = g.words.filter(w => !w.resolved && w.order !== g.idx);
  const clearance = wingHoldClearance();
  const holdBottom = deadline - clearance;
  const futureRoom = future.length
    ? Math.min(...future.map(w => holdBottom - (w.y + w.h)))
    : fullStep;
  // Every live word shares one visible formation step, so stopping cannot identify the answer
  // or let the target cross another block. The target's threat clock keeps descending invisibly.
  const formationStep = siege ? Math.max(0, Math.min(fullStep, futureRoom)) : 0;
  for (const w of g.words){
    if (w.resolved) w.y += fullStep;
    else if (siege){ w.y += formationStep; if (w.order === g.idx) w.holding = false; }
    else w.holding = false;
    if (w.flash > 0) w.flash -= dt;
    if (w.err > 0) w.err -= dt;
    if (w.resolved) continue;                    // fatal damage is committed; this shell can no longer hurt the player
    if (!siege){ w.holding = false; continue; }
    if (w.order !== g.idx){
      const holding = w.y + w.h >= holdBottom - 0.01;
      if (holding && !w.holding){
        tEv('wing_hold', { order:w.order, w:w.text, y:roundTrace(w.y),
          clearance:roundTrace(clearance), target:g.idx, effect:'hold_position' });
        tone(90, 70, .08, 'sine', .04);
      }
      w.holding = holding;
      continue;
    }
    if ((Number.isFinite(w.threatY) ? w.threatY : w.y) + w.h >= deadline){
      loseLife(w); return;
    }
  }
  if (active && g.words.some(w=>!w.resolved)){
    g.enemyFireT -= dt;
    if (g.enemyFireT <= 0){
      const shooters = g.words.filter(w=>!w.resolved);
      const volleys = g.solved >= 3 ? 2 : 1;
      for (let i=0;i<volleys;i++) spawnEnemyShot(shooters[Math.floor(Math.random()*shooters.length)]);
      g.enemyFireT = Math.max(rules.fireMin,rules.fireStart-g.solved*.025);
    }
  }
  // Aiming never steers on desktop; arrow/touch movement remains independent of the lock.
  spawnMissiles(dt);
  for (const m of g.missiles){
    const t = m.target;
    if (!t || !g.words.includes(t)){ m.y += -560*dt; m.dead = m.y < -20; continue; }
    const renderX = wordVisualX(t), renderY = wordVisualY(t), tx = renderX + t.w/2, ty = renderY + t.h/2;
    const dx = tx - m.x, dy = ty - m.y, d = Math.hypot(dx, dy) || 1;
    const k = Math.min(1, 7*dt);
    m.vx += (dx/d*620 - m.vx) * k;
    m.vy += (dy/d*620 - m.vy) * k;
    m.x += m.vx*dt; m.y += m.vy*dt;
    if (Math.random() < 0.6) g.parts.push({ x: m.x, y: m.y, vx: 0, vy: 30, life: .25, t: 0, color: '#5a7a5a' });
    if (m.x >= renderX && m.x <= renderX+t.w && m.y >= renderY && m.y <= renderY+t.h){
      m.dead = true;
      t.flash = .12;
      t.hitAt=performance.now(); t.hitDir=m.vx>=0?1:-1;
      spawnParts(m.x, m.y, 7, '#aef0ae', 105);
      addPulse(m.x,m.y,20,'#aef0ae',.16);
      if (m.letter){    // the struck letter breaks off and tumbles away
        g.parts.push({ x: m.x, y: renderY, vx: (Math.random()*2-1)*120, vy: -140, life: .7, t: 0, color: '#d7ba7d', text: m.letter });
      }
      if (m.dmg > 0){
        t.hp = Math.max(0, t.hp - m.dmg);
        tone(300, 80, .08, 'sawtooth', .05);
        if (t.hp <= 0){ g.freeze = 0.05; settleWord(t); } // presentation settles later; hit-stop still makes it land
      }
    }
  }
  g.missiles = g.missiles.filter(m => !m.dead && m.y > -40 && m.x > -40 && m.x < W+40);
  for (const shot of g.enemyShots){
    shot.x += shot.vx*dt; shot.y += shot.vy*dt;
    const shipY=H-34, hitRadius=12+shot.r;
    const shipDistance=Math.hypot(shot.x-g.ship.x,shot.y-shipY);
    if (shipDistance < hitRadius){
      shot.dead = true; takeShipHit();
    } else if(g.variant==='B' && !shot.grazed && shot.vy>0){
      const wasArmed=!!shot.grazeArmed;
      if(shipDistance<GRAZE_RADIUS+shot.r) shot.grazeArmed=true;
      // Charge only after the armed bullet has safely crossed the ship's hit band.
      // Entering the ring and then getting hit is not a successful graze.
      if(wasArmed && shot.y>shipY+hitRadius) awardGraze(shot);
    }
  }
  g.enemyShots = g.enemyShots.filter(s => !s.dead && s.y < H+20 && s.x > -30 && s.x < W+30);
  // Heartbeat follows concrete incoming fire; siege also retains its shared formation deadline.
  g.danger = g.enemyShots.some(s => s.y > H-190) || (g.words.some(w => w.order === g.idx &&
    (Number.isFinite(w.threatY) ? w.threatY : w.y) > H - 200));
  if (g.danger){
    g.beatT -= dt;
    if (g.beatT <= 0){ g.beatT = 0.7; tone(85, 55, .14, 'sine', .16); }
  } else g.beatT = 0;
  for (const p of g.parts){ p.t += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += (p.text ? 0 : 140)*dt; }
  g.parts = g.parts.filter(p => p.t < p.life);
  for(const pulse of g.pulses){
    pulse.t+=dt;
    const q=Math.max(0,Math.min(1,pulse.t/pulse.life));
    pulse.r=4+(pulse.maxR-4)*(1-Math.pow(1-q,3));
  }
  g.pulses=g.pulses.filter(p=>p.t<p.life);
}

function threatLineY(){
  const deadline = H - 64;
  if (!g || !g.words) return deadline;
  const target = g.words.find(w => !w.resolved && w.order === g.idx);
  if (!target || !Number.isFinite(target.threatY)) return deadline;
  return Math.max(34, deadline - Math.max(0, target.threatY - target.y));
}

function signalCore(){
  if (W < 520){
    const core={ x:W/2, y:H-94, r:26, hidden:false };
    const live=g && g.words ? g.words.filter(w=>!w.settled) : [];
    const maxBottom=live.length ? Math.max(...live.map(w=>wordVisualY(w)+w.h)) : -Infinity;
    // Repeated wrong-answer lunges can consume the mobile gap. The core yields
    // before it can cover a choice; spokes and the SIGNAL label remain visible.
    core.hidden=maxBottom+8>core.y-core.r-5;
    return core;
  }
  return { x:W/2, y:Math.min(H-125,Math.max(335,H*.64)), r:48 };
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = g.variant === 'B' ? '#171735' : '#102b38';
  for (const s of g.stars) ctx.fillRect(s.x, s.y, 2, 2);
  // the sentence you are building lives INSIDE the sky — no looking away from the fight
  {
    let lineTxt = '> ' + replyText(g.idx, true);
    const tag = '  [' + g.idx + '/' + g.sentence.length + ']';
    ctx.font = '14px "Cascadia Mono", Consolas, monospace';
    let clipped = false;
    while (lineTxt.length > 4 && ctx.measureText(lineTxt + tag).width > W - 24){ lineTxt = lineTxt.slice(2); clipped = true; }
    ctx.textBaseline = 'top';
    ctx.fillStyle = g.variant === 'B' ? 'rgba(189,184,255,.94)' : 'rgba(159,233,251,.92)';
    g.builtDrawn = (clipped ? '…' : '') + lineTxt + tag;
    ctx.fillText(g.builtDrawn, 10, 82);
    ctx.textBaseline = 'middle';
    ctx.font = '15px "Cascadia Mono", Consolas, monospace';
  }
  const deadlineY = H - 64, pressureY = threatLineY();
  if (g.variant === 'A'){
    const laneXs=[.25,.5,.75].map(r=>W*r);
    ctx.strokeStyle='rgba(115,213,238,.1)'; ctx.setLineDash([3,9]);
    for(const x of laneXs){ ctx.beginPath(); ctx.moveTo(x,126); ctx.lineTo(x,deadlineY); ctx.stroke(); }
    for(let y=150;y<deadlineY;y+=58){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(73,121,138,.35)';
    ctx.beginPath(); ctx.moveTo(0, deadlineY); ctx.lineTo(W, deadlineY); ctx.stroke();
    ctx.strokeStyle = 'rgba(209,105,105,.48)'; ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.moveTo(0, pressureY); ctx.lineTo(W, pressureY); ctx.stroke(); ctx.setLineDash([]);
    if (pressureY < deadlineY - 1){
      ctx.fillStyle = 'rgba(209,105,105,.72)'; ctx.font = '11px "Cascadia Mono", Consolas, monospace';
      ctx.fillText('VECTOR PRESSURE', Math.max(8, W - 128), Math.max(14, pressureY - 9));
    }
  } else {
    const core=signalCore(), coreX=core.x, coreY=core.y;
    const focusState=focusSelection(g.typePrefix), focusSet=new Set(focusState.candidates);
    for(const w of g.words){
      const wx=wordVisualX(w)+w.w/2, wy=wordVisualY(w)+w.h/2, focused=focusSet.has(w), incoming=w.resolved;
      ctx.strokeStyle=incoming?'rgba(94,230,223,.62)':focused ? (focusState.chosen?'rgba(94,230,223,.85)':'rgba(189,184,255,.75)') : 'rgba(104,100,170,.16)';
      ctx.lineWidth=focused||incoming?2:1; ctx.setLineDash(focused||incoming?[]:[4,8]);
      ctx.beginPath(); ctx.moveTo(coreX,coreY); ctx.lineTo(wx,wy); ctx.stroke();
    }
    ctx.setLineDash([]); ctx.lineWidth=1;
    if(!core.hidden){
      const ratio=Math.max(0,Math.min(1,(deadlineY-pressureY)/Math.max(1,H-130)));
      ctx.strokeStyle='rgba(104,100,170,.35)'; ctx.lineWidth=9;
      ctx.beginPath(); ctx.arc(coreX,coreY,core.r,-Math.PI*.75,Math.PI*.75); ctx.stroke();
      ctx.strokeStyle=ratio>.7?'#d16969':'#5ee6df';
      ctx.beginPath(); ctx.arc(coreX,coreY,core.r,-Math.PI*.75,-Math.PI*.75+Math.PI*1.5*ratio); ctx.stroke();
      ctx.lineWidth=1; ctx.fillStyle='rgba(12,12,31,.92)';
      ctx.beginPath(); ctx.arc(coreX,coreY,core.r-10,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(189,184,255,.75)'; ctx.stroke();
      ctx.fillStyle=g.typePrefix?'#5ee6df':'#9f9af4'; ctx.font='11px "Cascadia Mono", Consolas, monospace';
      const coreText=g.typePrefix?g.typePrefix.toUpperCase():'CORE';
      ctx.fillText(coreText,coreX-ctx.measureText(coreText).width/2,coreY-3);
      const syncRatio=Math.max(0,Math.min(1,(g.sync||0)/SYNC_MAX));
      ctx.strokeStyle=syncRatio>=1?'#d7ba7d':'#5ee6df'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(coreX,coreY,Math.max(8,core.r-7),-Math.PI/2,-Math.PI/2+Math.PI*2*syncRatio); ctx.stroke();
      ctx.lineWidth=1; ctx.fillStyle=syncRatio>=1?'#d7ba7d':'rgba(159,154,244,.8)';
      ctx.font='9px "Cascadia Mono", Consolas, monospace';
      const syncText='S'+Math.round(g.sync||0);
      ctx.fillText(syncText,coreX-ctx.measureText(syncText).width/2,coreY+11);
    }
    ctx.fillStyle='rgba(159,154,244,.72)'; ctx.fillText('SIGNAL PRESSURE',10,112);
    ctx.strokeStyle='rgba(209,105,105,.35)'; ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.moveTo(0,pressureY); ctx.lineTo(W,pressureY); ctx.stroke(); ctx.setLineDash([]);
  }
  for(const pulse of g.pulses){
    const q=Math.max(0,Math.min(1,pulse.t/pulse.life));
    ctx.globalAlpha=(1-q)*.82; ctx.strokeStyle=pulse.color; ctx.lineWidth=1+4*(1-q);
    ctx.beginPath(); ctx.arc(pulse.x,pulse.y,pulse.r,0,Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha=1; ctx.lineWidth=1;
  ctx.font = '15px "Cascadia Mono", Consolas, monospace';
  ctx.textBaseline = 'middle';
  const danger = !!g.danger;
  if (danger){   // red vignette pulses with the heartbeat
    const a = 0.05 + 0.05 * Math.abs(Math.sin(performance.now()/180));
    const grad = ctx.createLinearGradient(0, H-220, 0, H);
    grad.addColorStop(0, 'rgba(209,105,105,0)');
    grad.addColorStop(1, 'rgba(209,105,105,' + a + ')');
    ctx.fillStyle = grad;
    ctx.fillRect(0, H-220, W, 220);
  }
  const drawFocus=focusSelection(g.typePrefix), focusSet=new Set(drawFocus.candidates);
  for (const w of g.words){
    const wx = wordVisualX(w), wy = wordVisualY(w);
    const isNext = !w.resolved && w.order === g.idx;
    const incoming = w.resolved && !w.settled;
    const dmg = w.maxhp - w.hp;
    const focused=focusSet.has(w), uniqueFocus=focused && !!drawFocus.chosen;
    ctx.globalAlpha = 1;
    ctx.fillStyle = focused ? (g.variant==='B'?'#1b1b42':'#102f3b') : w.err > 0 ? '#2a1010' : w.flash > 0 ? '#1e321e' : '#0b110b';
    ctx.strokeStyle = focused ? (uniqueFocus?'#5ee6df':(g.variant==='B'?'#bdb8ff':'#73d5ee')) : w.err > 0 ? '#d16969' : incoming ? '#5ee6df' : dmg > 0 ? '#6fae6f' : (g.variant==='B'?'#4a477e':'#27687b');
    ctx.lineWidth = focused ? 3 : incoming || dmg > 0 ? 2 : 1;
    ctx.fillRect(wx, wy, w.w, w.h);
    ctx.strokeRect(wx, wy, w.w, w.h);
    if(focused){
      ctx.fillStyle=uniqueFocus?'#5ee6df':(g.variant==='B'?'#bdb8ff':'#73d5ee');
      ctx.font='10px "Cascadia Mono", Consolas, monospace';
      ctx.fillText(uniqueFocus?'TAB':'FOCUS',wx+5,wy-8);
      ctx.font='15px "Cascadia Mono", Consolas, monospace';
    }
    const baseCol = focused && uniqueFocus ? '#f0f3ff' : w.err > 0 ? '#f0b0b0' : (g.variant==='B'?'#dddafb':'#cbe8ef');
    if (isNext && w.consumed > 0){
      const pre = w.text.slice(0, w.consumed), rest = w.text.slice(w.consumed);
      const preW = ctx.measureText(pre).width;
      ctx.fillStyle = '#d7ba7d';
      ctx.fillText(pre, wx + 11, wy + w.h/2 + 1);
      ctx.fillStyle = baseCol;
      ctx.fillText(rest, wx + 11 + preW, wy + w.h/2 + 1);
    } else {
      ctx.fillStyle = baseCol;
      ctx.fillText(w.text, wx + 11, wy + w.h/2 + 1);
    }
    if(incoming){
      const pulse=.45+.45*Math.abs(Math.sin(performance.now()/90));
      ctx.fillStyle='rgba(94,230,223,'+pulse+')';
      ctx.beginPath(); ctx.arc(wx+w.w-8,wy+7,2.2,0,Math.PI*2); ctx.fill();
    }
    if (dmg > 0){
      ctx.strokeStyle = 'rgba(174,240,174,.5)'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(wx + w.w*0.3, wy); ctx.lineTo(wx + w.w*0.4, wy + w.h*0.6);
      if (dmg > 1){ ctx.moveTo(wx + w.w*0.7, wy + w.h); ctx.lineTo(wx + w.w*0.6, wy + w.h*0.3); }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // homing missiles: oriented streaks with glow
  ctx.strokeStyle = g.variant==='B'?'#bdb8ff':'#9fe9fb'; ctx.lineWidth = 2.5;
  ctx.shadowColor = g.variant==='B'?'#bdb8ff':'#9fe9fb'; ctx.shadowBlur = 8;
  for (const m of g.missiles){
    const d = Math.hypot(m.vx, m.vy) || 1;
    ctx.beginPath();
    ctx.moveTo(m.x, m.y);
    ctx.lineTo(m.x - m.vx/d*13, m.y - m.vy/d*13);
    ctx.stroke();
  }
  ctx.shadowBlur = 0; ctx.lineWidth = 1;
  // Hostile shots make the language puzzle a real dodge-and-fire loop.
  ctx.strokeStyle = '#d16969'; ctx.fillStyle = '#f08b8b'; ctx.lineWidth = 2;
  ctx.shadowColor = '#d16969'; ctx.shadowBlur = 9;
  for (const s of g.enemyShots){
    const d = Math.hypot(s.vx,s.vy) || 1;
    ctx.beginPath(); ctx.moveTo(s.x,s.y);
    ctx.lineTo(s.x-s.vx/d*11,s.y-s.vy/d*11); ctx.stroke();
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
  ctx.shadowBlur = 0; ctx.lineWidth = 1;
  // lock brackets on the current target
  if (g.lock){
    const t = g.lock, tx = wordVisualX(t), ty = wordVisualY(t), c = 7;
    ctx.strokeStyle = '#d7ba7d'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(tx-4, ty-4+c); ctx.lineTo(tx-4, ty-4); ctx.lineTo(tx-4+c, ty-4);
    ctx.moveTo(tx+t.w+4-c, ty-4); ctx.lineTo(tx+t.w+4, ty-4); ctx.lineTo(tx+t.w+4, ty-4+c);
    ctx.moveTo(tx-4, ty+t.h+4-c); ctx.lineTo(tx-4, ty+t.h+4); ctx.lineTo(tx-4+c, ty+t.h+4);
    ctx.moveTo(tx+t.w+4-c, ty+t.h+4); ctx.lineTo(tx+t.w+4, ty+t.h+4); ctx.lineTo(tx+t.w+4, ty+t.h+4-c);
    ctx.stroke(); ctx.lineWidth = 1;
  }
  const sx = g.ship.x, sy = H - 34;
  ctx.globalAlpha = performance.now() < (g.hitInvulnUntil || 0)
    ? (.35 + .35*Math.abs(Math.sin(performance.now()/70))) : 1;
  ctx.shadowColor = g.variant === 'B' ? '#bdb8ff' : '#73d5ee'; ctx.shadowBlur = 14;
  ctx.fillStyle = g.variant === 'B' ? '#bdb8ff' : '#73d5ee';
  ctx.beginPath();
  ctx.moveTo(sx, sy - 14); ctx.lineTo(sx - 11, sy + 10); ctx.lineTo(sx, sy + 4); ctx.lineTo(sx + 11, sy + 10);
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(215,186,125,' + (0.4 + Math.random()*0.5) + ')';
  ctx.fillRect(sx - 2, sy + 10, 4, 5 + Math.random()*6);
  ctx.globalAlpha = 1;
  for (const p of g.parts){
    const a = 1 - p.t/p.life;
    ctx.globalAlpha = a;
    if (p.text){
      ctx.fillStyle = p.color;
      ctx.font = '13px "Cascadia Mono", Consolas, monospace';
      ctx.fillText(p.text, p.x, p.y);
      ctx.font = '15px "Cascadia Mono", Consolas, monospace';
    } else {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
  }
}

// ---------- input ----------
let lastMode = 'tap';
function begin(mode){ lastMode = mode; startGame(mode); }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  tapAt(e.clientX - r.left, e.clientY - r.top);
});
cv.addEventListener('pointermove', e => {
  if (!g || g.over || g.viewportPaused) return;
  // Both tests use the mouse strictly as an aiming cursor on desktop so held arrows can dodge
  // independently while the player points at and clicks a chunk. Touch drag still steers.
  if (e.pointerType === 'mouse') return;
  const r = cv.getBoundingClientRect();
  g.ship.x = Math.max(16,Math.min(W-16,e.clientX-r.left));
  g.ship.manualUntil = performance.now()+500;
});
$('start').addEventListener('pointerdown', e => { e.preventDefault(); begin('tap'); });
$('over').addEventListener('pointerdown', e => { e.preventDefault(); begin(lastMode); });
$('h-tabs').addEventListener('pointerdown', e => { e.preventDefault(); handleTab(); });
window.addEventListener('keydown', e => {
  if (e.key === 'Tab'){ e.preventDefault(); handleTab(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!$('start').classList.contains('hidden')){
    if (e.key.length === 1){ e.preventDefault(); begin('type'); handleKey(e.key); }
    return;
  }
  if (!$('over').classList.contains('hidden')){
    if (e.key.length === 1 || e.key === 'Enter'){ e.preventDefault(); begin(lastMode); }
    return;
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight'){
    e.preventDefault();
    const side = e.key === 'ArrowLeft' ? 'left' : 'right';
    if (!moveInput[side]){
      const nudge = side === 'left' ? -20 : 20;
      g.ship.x = Math.max(16,Math.min(W-16,g.ship.x+nudge));
    }
    moveInput[side] = true;
    return;
  }
  if (e.key.length === 1 || e.key === 'Backspace'){ e.preventDefault(); handleKey(e.key); }
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft') moveInput.left = false;
  if (e.key === 'ArrowRight') moveInput.right = false;
});
window.addEventListener('blur', () => { moveInput.left = false; moveInput.right = false; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ moveInput.left = false; moveInput.right = false; }
});
$('start-best').textContent = 'best: ' + (+(localStorage.getItem('shooter2_best') || 0));
resize();
</script>
